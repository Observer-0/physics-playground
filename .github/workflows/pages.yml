name: Tests & GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Eingecheckte dist/index.html aktuell?
        run: |
          if ! git diff --quiet -- dist/index.html; then
            echo "::warning file=dist/index.html::dist/index.html ist veraltet – lokal 'npm run build' ausführen und committen. Veröffentlicht wird trotzdem der frische Build."
          fi

      - name: Pages-Artefakt hochladen
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
