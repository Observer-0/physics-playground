<!doctype html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Physics Playground</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪐</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=STIX+Two+Text:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
/* Physics Playground — styles */
:root {
  --bg: #0a0d11; --panel: #10151b; --panel2: #161c24; --line: #222b36; --line2: #2e3844;
  --grid: rgba(140, 162, 190, 0.075);
  --ink: #e7ebf0; --ink2: #9ba7b4; --ink3: #5e6976;
  --accent: #f3b34c; --accent-soft: rgba(243, 179, 76, 0.12);
  --cyan: #62c6d4; --red: #ef6a6a; --red-soft: rgba(239, 106, 106, 0.1);
  --green: #7fcf93; --violet: #b69cf2; --violet-soft: rgba(182, 156, 242, 0.1);
  --font-sans: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --font-math: "STIX Two Text", "STIX Two Math", "Cambria Math", "Times New Roman", serif;
  --r: 6px;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; } }
:root[data-theme="dark"] { color-scheme: dark; }
:root[data-theme="light"] {
  --bg: #f3f4f1; --panel: #ffffff; --panel2: #eaece7; --line: #d7dad3; --line2: #c3c7bf;
  --grid: rgba(40, 50, 60, 0.07);
  --ink: #14181d; --ink2: #4b5560; --ink3: #8a939c;
  --accent: #a8650a; --accent-soft: rgba(168, 101, 10, 0.1);
  --cyan: #137f8e; --red: #c03838; --red-soft: rgba(192, 56, 56, 0.08);
  --green: #2a8744; --violet: #6446bd; --violet-soft: rgba(100, 70, 189, 0.08);
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font-sans); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--cyan); }
::selection { background: var(--accent-soft); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink2); }
.faint { color: var(--ink3); }
[hidden] { display: none !important; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 244px minmax(0, 1fr); min-height: 100vh; }
.side { border-right: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; }
.brand { padding: 18px 18px 14px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid var(--line); }
.brand svg { flex: none; }
.brand b { display: block; font-size: 15px; letter-spacing: -0.01em; }
.brand span { display: block; font-size: 11.5px; color: var(--ink3); }
.nav { padding: 10px 8px 16px; flex: 1; }
.nav h6 { margin: 16px 10px 4px; font-size: 11.5px; font-weight: 500; color: var(--ink3); }
.nav a { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 10px; border-radius: 5px; color: var(--ink2); text-decoration: none; font-size: 13.5px; }
.nav a:hover { background: var(--panel2); color: var(--ink); }
.nav a.on { background: var(--panel2); color: var(--ink); box-shadow: inset 2px 0 0 var(--accent); }
.nav a.hall.on { box-shadow: inset 2px 0 0 var(--violet); }
.nav a small { font-family: var(--font-mono); font-size: 11px; color: var(--ink3); }
.side-foot { padding: 12px 14px 16px; border-top: 1px solid var(--line); display: grid; gap: 10px; }
.switch { display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; font-size: 13px; }
.switch input { appearance: none; width: 30px; height: 17px; border-radius: 9px; background: var(--line2); position: relative; margin: 0; flex: none; transition: background .15s; }
.switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%; background: var(--ink); transition: transform .15s; }
.switch input:checked { background: var(--red); }
.switch input:checked::after { transform: translateX(13px); }
.switch.plain input:checked { background: var(--accent); }
.switch small { display: block; color: var(--ink3); font-size: 11.5px; line-height: 1.3; }
.topbar { display: none; }
main { min-width: 0; padding: 22px 28px 60px; }
.brk-banner { border: 1px solid var(--red); background: var(--red-soft); color: var(--ink); border-radius: var(--r); padding: 8px 12px; margin-bottom: 16px; font-size: 13px; }
.brk-banner b { color: var(--red); }

/* ---------- common ---------- */
.btn { border: 1px solid var(--line2); background: var(--panel); border-radius: 5px; padding: 5px 11px; font-size: 13px; color: var(--ink); white-space: nowrap; }
.btn:hover { border-color: var(--ink3); background: var(--panel2); }
.btn.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.btn.sm { padding: 2px 8px; font-size: 12px; }
.btn.icon { padding: 3px 8px; font-family: var(--font-mono); }
.btn:disabled { opacity: .4; cursor: default; }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 5px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 3px 10px; font-size: 12px; color: var(--ink2); }
.seg button + button { border-left: 1px solid var(--line2); }
.seg button.on { background: var(--panel2); color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); }
select { background: var(--panel); border: 1px solid var(--line2); border-radius: 5px; padding: 3px 6px; font-size: 13px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.ph { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 12px; border-bottom: 1px solid var(--line); min-height: 42px; }
.ph h3 { margin: 0; font-size: 13px; font-weight: 500; color: var(--ink2); margin-right: auto; }
.pb { padding: 12px; }
.chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line2); border-radius: 20px; padding: 2px 10px; font-size: 12.5px; background: transparent; color: var(--ink2); }
.chip:hover { color: var(--ink); border-color: var(--ink3); }
.chip.on { color: var(--ink); border-color: var(--accent); }
.chip i { width: 10px; height: 2px; display: inline-block; }
.kbd { font-family: var(--font-mono); font-size: 11.5px; border: 1px solid var(--line2); border-radius: 3px; padding: 0 4px; color: var(--ink2); }
table.t { border-collapse: collapse; width: 100%; font-size: 13px; }
table.t th { text-align: left; font-weight: 500; color: var(--ink3); font-size: 12px; padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t tr:last-child td { border-bottom: 0; }
.scroll-x { overflow-x: auto; }
.callout { border-left: 2px solid var(--cyan); padding: 6px 12px; color: var(--ink2); margin: 12px 0; font-size: 13.5px; }
.callout.warn { border-color: var(--red); }
.callout b { color: var(--ink); font-weight: 500; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 7px 14px; border-radius: 5px; font-size: 13px; z-index: 50; }

/* ---------- experiment header ---------- */
.xhead { display: flex; align-items: flex-end; gap: 20px; flex-wrap: wrap; margin-bottom: 16px; }
.xhead .crumb { font-size: 12.5px; color: var(--ink3); margin-bottom: 2px; }
.xhead h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.15; }
.xhead .sub { color: var(--ink2); font-size: 14px; margin-top: 2px; }
.xhead .eq { font-size: 22px; padding: 2px 0; margin-left: 4px; }
.xhead .acts { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; position: relative; }
.pop { position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; width: min(360px, 90vw); background: var(--panel); border: 1px solid var(--line2); border-radius: var(--r); padding: 12px; box-shadow: 0 12px 30px rgba(0, 0, 0, .35); display: grid; gap: 8px; }
.pop label { font-size: 12px; color: var(--ink3); }
.pop input { width: 100%; background: var(--bg); border: 1px solid var(--line2); border-radius: 4px; padding: 5px 8px; font-family: var(--font-mono); font-size: 12px; }
.pop .row { display: flex; gap: 6px; }

/* ---------- lab layout ---------- */
.lab { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 14px; align-items: start; }
.stage { display: grid; gap: 14px; min-width: 0; }
.vizwrap { position: relative; height: 330px; }
.vizwrap canvas, .plotwrap canvas { width: 100%; height: 100%; display: block; }
.plotwrap { position: relative; height: 300px; touch-action: none; }
.plotwrap.small { height: 190px; }
.plotwrap + .plotwrap { border-top: 1px solid var(--line); }
.tip { position: absolute; pointer-events: none; background: var(--bg); border: 1px solid var(--line2); border-radius: 4px; padding: 5px 8px; font: 12px/1.5 var(--font-mono); color: var(--ink); white-space: nowrap; z-index: 5; }
.tip i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.gsel { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink3); flex-wrap: wrap; }
.legend { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 12px 0; }
.ghint { font-size: 11.5px; color: var(--ink3); padding: 4px 12px 8px; }
.controls { display: grid; gap: 14px; position: sticky; top: 14px; }

.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.presets .chip { border-radius: 4px; }
.pnote { font-size: 12px; color: var(--ink3); margin-top: 8px; min-height: 0; }

.prm { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.prm:last-child { border-bottom: 0; }
.prm .lab2 { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.prm .lab2 .math { font-size: 17px; }
.prm .nm { font-size: 12px; color: var(--ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prm .valbox { display: flex; align-items: center; gap: 4px; justify-self: end; }
.prm input.num { width: 118px; text-align: right; background: var(--bg); border: 1px solid var(--line2); border-radius: 4px; padding: 3px 7px; font-family: var(--font-mono); font-size: 12.5px; }
.prm input.num:focus { outline: none; border-color: var(--accent); }
.prm input.num.bad { border-color: var(--red); }
.prm .unit { font-family: var(--font-mono); font-size: 12px; color: var(--ink2); min-width: 64px; }
.prm .sl { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; }
.prm .sl .scl { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink3); width: 26px; text-align: right; }
.prm .extra { grid-column: 1 / -1; display: flex; gap: 4px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--ink3); }
.prm.locked .num { color: var(--ink2); }
.prm.off input.num { border-color: var(--red); }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; margin: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 3px; background: linear-gradient(to right, var(--accent) var(--p, 0%), var(--line2) var(--p, 0%)); border-radius: 2px; }
input[type=range]::-moz-range-track { height: 3px; background: var(--line2); border-radius: 2px; }
input[type=range]::-moz-range-progress { height: 3px; background: var(--accent); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5.5px; border-radius: 50%; background: var(--ink); border: 3px solid var(--bg); box-shadow: 0 0 0 1px var(--accent); }
input[type=range]::-moz-range-thumb { width: 10px; height: 10px; border-radius: 50%; background: var(--ink); border: 3px solid var(--bg); box-shadow: 0 0 0 1px var(--accent); }
input[type=range]:disabled { opacity: .35; }
input[type=range]:focus-visible { outline: 1px dashed var(--accent); outline-offset: 2px; }

.abbar { display: flex; align-items: center; gap: 8px; }

/* results */
.rp { padding: 4px 0 10px; }
.rp .line { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.rp .line .math { font-size: 22px; }
.rp .v { font-family: var(--font-mono); font-size: 25px; color: var(--accent); letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.rp .u { font-family: var(--font-mono); font-size: 15px; color: var(--ink2); }
.rp .meta { font-size: 12px; color: var(--ink3); margin-top: 3px; }
.rp .delta { font-size: 12.5px; color: var(--ink2); margin-top: 4px; font-family: var(--font-mono); }
.rlist td { font-size: 12.5px; }
.rlist td.k { width: 1%; white-space: nowrap; }
.rlist td.k .math { font-size: 15px; }
.rlist td.val { font-family: var(--font-mono); text-align: right; white-space: nowrap; }
.rlist td.val .alt { display: block; color: var(--ink3); font-size: 11.5px; }
.rlist td.nm { color: var(--ink3); font-size: 12px; }
.rlist td.err { color: var(--red); font-family: var(--font-sans); }
.cmp td.val { color: var(--ink); }
.cmp td.ratio { color: var(--accent); font-family: var(--font-mono); text-align: right; white-space: nowrap; }
.cmp th { text-align: right; }
.cmp th:first-child { text-align: left; }

/* status */
.stat { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.st { border: 1px solid var(--line); border-radius: 4px; padding: 5px 8px; font-size: 12px; display: flex; gap: 7px; align-items: center; color: var(--ink2); }
.st::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex: none; }
.st.warn { border-color: var(--red); color: var(--ink); }
.st.warn::before { background: var(--red); }
.st.soft::before { background: var(--accent); }
.issues { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.issues li { font-size: 12.5px; line-height: 1.45; padding-left: 10px; border-left: 2px solid var(--line2); color: var(--ink2); }
.issues li b { display: block; font-weight: 500; font-size: 11.5px; color: var(--ink3); }
.issues li.math, .issues li.unreal { border-color: var(--red); }
.issues li.math b, .issues li.unreal b { color: var(--red); }
.issues li.model { border-color: var(--accent); }
.issues li.model b { color: var(--accent); }
.issues li.numeric { border-color: var(--violet); }
.issues li.numeric b { color: var(--violet); }
.issues li.info { border-color: var(--cyan); }

/* tabs */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 26px 0 18px; overflow-x: auto; }
.tabs button { background: none; border: 0; padding: 9px 14px; font-size: 14px; color: var(--ink2); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button:hover { color: var(--ink); }
.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
.hallx .tabs button.on { border-bottom-color: var(--violet); }
.tabs button small { color: var(--ink3); margin-left: 6px; font-size: 11.5px; }
.prose { max-width: 760px; }
.prose p { margin: 0 0 12px; }
.lvl { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 8px 22px; margin-bottom: 26px; }
.lvl > .lk { font-size: 12.5px; color: var(--ink3); padding-top: 3px; }
.lvl > .lk b { display: block; color: var(--ink2); font-weight: 500; font-size: 13px; }
.steps { display: grid; gap: 10px; }
.step { display: grid; grid-template-columns: minmax(160px, 240px) minmax(0, 1fr); gap: 16px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.step:last-child { border-bottom: 0; }
.step .d { font-size: 13px; color: var(--ink2); }
.step .math { font-size: 18px; }
.ep { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.ep li { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 12px; font-size: 13.5px; }
.tag { font-size: 11.5px; border-radius: 3px; padding: 1px 7px; border: 1px solid currentColor; justify-self: start; white-space: nowrap; height: fit-content; }
.tag.math { color: var(--cyan); } .tag.model { color: var(--accent); } .tag.approx { color: var(--violet); }
.tag.measured { color: var(--green); } .tag.assume { color: var(--ink2); }
.tag.exact { color: var(--cyan); } .tag.convention, .tag.astro, .tag.cosmo { color: var(--violet); }

/* ---------- math ---------- */
.math { font-family: var(--font-math); font-size: 1.12em; white-space: nowrap; line-height: 1.2; display: inline-block; vertical-align: middle; }
.math i.mi { font-style: italic; padding-right: .02em; }
.math .mu, .math .mn, .math .mrm, .math .mtx { font-style: normal; }
.math .mtx { font-family: var(--font-sans); font-size: .82em; padding: 0 .15em; }
.math .msf { font-family: var(--font-sans); font-size: .86em; font-style: normal; }
.math .mo { padding: 0 .22em; }
.math .mp { padding-right: .18em; }
.math .mfn { padding-right: .08em; }
.math .mfr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; margin: 0 .1em; }
.math .mfr > span { padding: 0 .15em; }
.math .mfr > .mnu { border-bottom: .06em solid currentColor; padding-bottom: .08em; }
.math .mfr > .mde { padding-top: .08em; }
.math .mfr.mt { font-size: .78em; }
.math .msq { display: inline-flex; align-items: stretch; }
.math .mrad { font-size: 1.05em; line-height: 1; padding-right: .02em; align-self: center; }
.math .msqbig .mrad { transform: scaleY(1.9); transform-origin: center; }
.math .msqc { border-top: .06em solid currentColor; padding: .06em .1em 0 .05em; }
.math .msc { display: inline-flex; align-items: center; }
.math .msup, .math .msub { font-size: .7em; line-height: 1; }
.math .msup { align-self: flex-start; margin-top: -.15em; padding-left: .04em; }
.math .msub { align-self: flex-end; margin-bottom: -.2em; padding-left: .02em; }
.math .mss { display: inline-flex; flex-direction: column; font-size: .7em; line-height: 1.05; margin-left: .04em; }
.math .md { font-style: normal; }
.math .mdbig { display: inline-block; transform: scaleY(1.9); padding: 0 .06em; }
.math .mint { font-size: 1.5em; font-style: normal; }
.math .mhat { position: relative; display: inline-block; }
.math .mhat::after { content: "^"; position: absolute; left: 50%; top: -.55em; transform: translateX(-40%); font-size: .8em; font-style: normal; }
.math .msp { display: inline-block; }
.mathd { display: block; text-align: center; font-size: 1.5em; padding: 6px 0; overflow-x: auto; overflow-y: hidden; }

/* ---------- dimension analysis ---------- */
.dimtop { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 8px; }
.honest { font-size: 13px; color: var(--ink2); border: 1px solid var(--line2); border-radius: var(--r); padding: 8px 12px; margin: 0 0 18px; }
.honest b { color: var(--ink); font-weight: 500; }
.deq { border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); margin-bottom: 16px; overflow: hidden; }
.deq > header { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--line); }
.deq > header h4 { margin: 0; font-size: 13.5px; font-weight: 500; margin-right: auto; }
.verdict { font-size: 12.5px; border-radius: 3px; padding: 1px 8px; }
.verdict.ok { color: var(--green); border: 1px solid var(--green); }
.verdict.bad { color: var(--red); border: 1px solid var(--red); }
.deq .eqrow { padding: 14px; font-size: 20px; text-align: center; overflow-x: auto; border-bottom: 1px solid var(--line); }
.deq .body { padding: 12px 14px; display: grid; gap: 14px; }
.side-lbl { font-size: 12px; color: var(--ink3); margin-bottom: 4px; }
.facs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.fac { border: 1px solid var(--line); border-radius: 4px; padding: 6px 9px; display: grid; gap: 2px; background: var(--bg); }
.fac .math { font-size: 17px; }
.fac .arrow { color: var(--ink3); font-size: 12px; }
.fac .dm .math { font-size: 15px; color: var(--cyan); }
.fac .nm { font-size: 11px; color: var(--ink3); line-height: 1.3; }
.fac.num .dm { color: var(--ink3); font-size: 12px; }
.combine { font-size: 18px; text-align: center; padding: 6px 0; overflow-x: auto; }
.combine .math { color: var(--ink); }
.combine .dimc { color: var(--cyan); }
.balance { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; padding: 12px 0 4px; }
.balance .pan { border: 1px solid var(--line2); border-radius: 4px; padding: 10px; text-align: center; }
.balance .pan .math { font-size: 20px; color: var(--cyan); }
.balance .pan small { display: block; color: var(--ink3); font-size: 11.5px; margin-top: 2px; }

<div id="root"><noscript>Der Physics Playground braucht JavaScript.</noscript></div>
<script>
/* ---- src/core/engine.js ---- */
/* =====================================================================
   Physics Playground — Formula Engine
   Formula → AST → Dimensions → Evaluation (double + log10 domain)
   Pure logic, no DOM. Runs in the browser and in Node (tests).
   ===================================================================== */
(function (PP) {
  'use strict';

  // Nur eigene Einträge zählen. Sonst wären Namen wie „constructor“ oder „toString“
  // in jedem Objekt „bekannt“ und würden als Konstante, Funktion oder Dimension gelesen.
  const has = (o, k) => o != null && Object.prototype.hasOwnProperty.call(o, k);

  /* ---------- Rational numbers (for exponents like L^-1/2) ---------- */
  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a || 1; }
  function R(n, d = 1) {
    if (d < 0) { n = -n; d = -d; }
    const g = gcd(n, d);
    return { n: n / g, d: d / g };
  }
  const Rz = R(0);
  const radd = (a, b) => R(a.n * b.d + b.n * a.d, a.d * b.d);
  const rmul = (a, b) => R(a.n * b.n, a.d * b.d);
  const rneg = (a) => R(-a.n, a.d);
  const rzero = (a) => a.n === 0;
  const rval = (a) => a.n / a.d;
  function rFromNumber(x, maxDen = 64) {
    if (!isFinite(x)) return null;
    for (let d = 1; d <= maxDen; d++) {
      const n = Math.round(x * d);
      if (Math.abs(n / d - x) < 1e-9) return R(n, d);
    }
    return null;
  }

  /* ---------- Dimensions: exponents of 7 SI base quantities ---------- */
  const BASES = ['M', 'L', 'T', 'Θ', 'I', 'N', 'J'];
  const SI_BASE = ['kg', 'm', 's', 'K', 'A', 'mol', 'cd'];
  const BASE_NAMES = ['Masse', 'Länge', 'Zeit', 'Temperatur', 'Stromstärke', 'Stoffmenge', 'Lichtstärke'];

  const dimless = () => BASES.map(() => Rz);
  function dimParse(str) {
    const d = dimless();
    if (!str || str.trim() === '1' || str.trim() === '') return d;
    const re = /(Θ|Th|M|L|T|I|N|J)(?:\^(-?\d+)(?:\/(\d+))?)?/g;
    let m, consumed = '';
    while ((m = re.exec(str))) {
      const key = m[1] === 'Th' ? 'Θ' : m[1];
      const i = BASES.indexOf(key);
      if (m[3] && parseInt(m[3], 10) === 0) throw new Error('Ungültige Dimensionsangabe: Nenner 0 im Exponenten von ' + key);
      const e = R(m[2] ? parseInt(m[2], 10) : 1, m[3] ? parseInt(m[3], 10) : 1);
      d[i] = radd(d[i], e);
      consumed += m[0];
    }
    if (consumed.replace(/\s/g, '') !== str.replace(/\s/g, '')) throw new Error('Ungültige Dimensionsangabe: ' + str);
    return d;
  }
  const dimMul = (a, b) => a.map((x, i) => radd(x, b[i]));
  const dimDiv = (a, b) => a.map((x, i) => radd(x, rneg(b[i])));
  const dimPow = (a, p) => a.map((x) => rmul(x, p));
  const dimEq = (a, b) => a.every((x, i) => x.n === b[i].n && x.d === b[i].d);
  const dimIsless = (a) => a.every(rzero);
  const dimKey = (a) => a.map((x) => x.n + '/' + x.d).join(',');

  const SUP = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹', '-': '⁻', '/': 'ᐟ' };
  const sup = (s) => String(s).split('').map((c) => SUP[c] || c).join('');
  const rStr = (r) => (r.d === 1 ? String(r.n) : r.n + '/' + r.d);
  const rTex = (r) => (r.d === 1 ? String(r.n) : r.n + '/' + r.d);

  function dimStr(a) {
    const parts = [];
    a.forEach((e, i) => { if (!rzero(e)) parts.push(BASES[i] + (e.n === 1 && e.d === 1 ? '' : sup(rStr(e)))); });
    return parts.length ? parts.join(' ') : '1';
  }
  function dimTex(a) {
    const parts = [];
    a.forEach((e, i) => {
      if (rzero(e)) return;
      const b = BASES[i] === 'Θ' ? '\\Theta' : '\\mathsf{' + BASES[i] + '}';
      parts.push(e.n === 1 && e.d === 1 ? b : b + '^{' + rTex(e) + '}');
    });
    return parts.length ? parts.join('\\,') : '1';
  }
  function siUnitStr(a) {
    const pos = [], neg = [];
    a.forEach((e, i) => {
      if (rzero(e)) return;
      const s = SI_BASE[i] + (e.n === 1 && e.d === 1 ? '' : sup(rStr(e)));
      (rval(e) > 0 ? pos : neg).push(s);
    });
    const all = pos.concat(neg);
    return all.length ? all.join(' ') : '1';
  }

  // Named derived units and quantity names (lookup by dimension)
  const NAMED = [
    ['M L T^-2', 'N', 'Kraft'],
    ['M L^2 T^-2', 'J', 'Energie'],
    ['M L^2 T^-3', 'W', 'Leistung'],
    ['M L^-1 T^-2', 'Pa = J/m³', 'Druck / Energiedichte'],
    ['M L^2 T^-2 Θ^-1', 'J/K', 'Entropie'],
    ['M L^2 T^-1', 'J s', 'Wirkung / Drehimpuls'],
    ['L T^-1', 'm/s', 'Geschwindigkeit'],
    ['L T^-2', 'm/s²', 'Beschleunigung'],
    ['T^-1', 's⁻¹', 'Frequenz / Rate'],
    ['L^2', 'm²', 'Fläche'],
    ['L^3', 'm³', 'Volumen'],
    ['L^-2', 'm⁻²', 'Krümmung'],
    ['M L T^-1', 'kg m/s', 'Impuls'],
    ['M T^-2', 'N/m', 'Federkonstante'],
    ['I T', 'C', 'Ladung'],
    ['L^3 M^-1 T^-2', 'm³ kg⁻¹ s⁻²', 'Gravitationskopplung'],
    ['M^-1 L^-1 T^2', 's² kg⁻¹ m⁻¹', 'Einstein-Kopplung'],
    ['M L T^-2 I^-2', 'N/A²', 'Permeabilität'],
    ['M^-1 L^-3 T^4 I^2', 'F/m', 'Permittivität'],
    ['L^-1/2', 'm⁻¹ᐟ²', 'Wellenfunktion (1D)'],
    ['L^-3/2', 'm⁻³ᐟ²', 'Wellenfunktion (3D)'],
    ['M', 'kg', 'Masse'], ['L', 'm', 'Länge'], ['T', 's', 'Zeit'], ['Θ', 'K', 'Temperatur'],
    ['I', 'A', 'Stromstärke'], ['N', 'mol', 'Stoffmenge'], ['N^-1', 'mol⁻¹', 'pro Stoffmenge'],
    ['', '1', 'dimensionslos'],
  ].map(([d, u, n]) => ({ key: dimKey(dimParse(d)), unit: u, name: n }));
  const NAMED_MAP = new Map(NAMED.map((x) => [x.key, x]));
  function dimInfo(a) {
    const hit = NAMED_MAP.get(dimKey(a));
    const si = siUnitStr(a);
    return { dim: dimStr(a), tex: dimTex(a), si, unit: hit ? hit.unit : si, name: hit ? hit.name : null };
  }

  /* ---------- Lexer / Parser → AST ---------- */
  const SUBS = { '₀': '0', '₁': '1', '₂': '2', '₃': '3', '₄': '4', '₅': '5', '₆': '6', '₇': '7', '₈': '8', '₉': '9' };
  const SUPS = { '⁰': '0', '¹': '1', '²': '2', '³': '3', '⁴': '4', '⁵': '5', '⁶': '6', '⁷': '7', '⁸': '8', '⁹': '9', '⁻': '-' };
  function normalize(src, map) {
    // Map pretty unicode to ASCII. Positions shift (ħ → hbar); if `map` is an array,
    // map[j] receives the raw index of normalized character j (map[out.length] = src.length).
    let out = '';
    const emit = (s, at) => { out += s; if (map) for (let k = 0; k < s.length; k++) map.push(at); };
    for (let i = 0; i < src.length; i++) {
      const ch = src[i], at = i;
      if (ch === 'ħ') emit('hbar', at);
      else if (ch === 'π') emit('pi', at);
      else if (ch === 'Λ') emit('Lambda', at);
      else if (ch === '·' || ch === '×' || ch === '⋅') emit('*', at);
      else if (ch === '−' || ch === '–') emit('-', at);
      else if (has(SUBS, ch)) emit(SUBS[ch], at);
      else if (has(SUPS, ch)) {
        let s = '';
        while (i < src.length && has(SUPS, src[i])) { s += SUPS[src[i]]; i++; }
        i--;
        emit('^' + (s.startsWith('-') ? '(' + s + ')' : s), at);
      } else if (ch === '√') emit('sqrt', at);
      else emit(ch, at);
    }
    if (map) map.push(src.length);
    return out;
  }

  function tokenize(src) {
    const toks = [];
    const re = /\s*(?:(\d+\.?\d*(?:[eE][+-]?\d+)?|\.\d+(?:[eE][+-]?\d+)?)|([A-Za-z_][A-Za-z0-9_]*)|(\S))/y;
    let m;
    re.lastIndex = 0;
    while (re.lastIndex < src.length) {
      const start = re.lastIndex;
      m = re.exec(src);
      if (!m) break;
      const pos = start + m[0].length - (m[1] || m[2] || m[3] || '').length;
      if (m[1] !== undefined) toks.push({ t: 'num', v: parseFloat(m[1]), s: pos, e: pos + m[1].length });

      try { href = location.href.split('#')[0] + '#' + st; } catch (_) { href = '#' + st; }
      p.innerHTML = '<label for="sharelink">Link auf genau diesen Zustand</label><div class="row"><input id="sharelink" readonly value="' + esc(href) + '"><button class="btn sm" data-a="copylink">Kopieren</button></div>' +
        '<label for="sharecode">Zustands-Code (zum Einfügen unter „Gespeichert“)</label><div class="row"><input id="sharecode" readonly value="' + esc(st) + '"><button class="btn sm" data-a="copycode">Kopieren</button></div>' +
        '<div class="faint" style="font-size:12px">Wenn die App in einer Vorschau läuft, funktioniert der Code zuverlässiger als der Link.</div>';
    }
    p.hidden = false;
    const f = p.querySelector('input'); if (f) { f.focus(); f.select(); }
    if (kind === 'save') f.addEventListener('keydown', (e) => { if (e.key === 'Enter') p.querySelector('[data-a="dosave"]').click(); });
  }
  function closePop() { const p = $('#pop'); if (p) p.hidden = true; }

  /* ---------- lab mount ---------- */
  let raf = 0, lastTs = 0, ro = null;
  S.plots = [];

  function mountLab() {
    unmountLab(true);
    const lab = $('#lab');
    if (!lab) return;
    recompute();
    renderParams();
    renderGraphPanel();
    update();
    lab.addEventListener('input', onLabInput);
    lab.addEventListener('change', onLabChange);
    lab.addEventListener('click', onLabClick);
    lab.addEventListener('focusout', onLabBlur);
    lab.addEventListener('keydown', onLabKey);
    if (typeof ResizeObserver === 'function') {
      ro = new ResizeObserver(() => { drawViz(); S.plots.forEach((p) => p.draw()); });
      $$('canvas', lab).forEach((c) => ro.observe(c));
    }
    lastTs = 0;
    if (typeof requestAnimationFrame === 'function') raf = requestAnimationFrame(tick);
  }
  function unmountLab(keepListeners) {
    if (raf && typeof cancelAnimationFrame === 'function') cancelAnimationFrame(raf);
    raf = 0;
    if (ro) { ro.disconnect(); ro = null; }
    S.plots = [];
    S.playing = false;
    void keepListeners;
  }

  function tick(ts) {
    raf = requestAnimationFrame(tick);
    const dt = lastTs ? Math.min(0.1, (ts - lastTs) / 1000) : 0;
    lastTs = ts;
    if (!$('#vizc')) return;
    if (document.hidden) return;
    if (S.playing) {
      const exp = S.exp, k = exp.animateVar, d = exp.vars[k];
      let lim = d.max;
      if (exp.animateUntil) {
        const r = S.res.A && S.res[S.edit].out[exp.animateUntil];
        if (r && r.ok && r.value > 0 && isFinite(r.value)) lim = Math.min(lim, r.value);
      }
      let x = S.vals[S.edit][k] + dt;
      if (x >= lim) { x = lim; S.playing = false; }
      S.vals[S.edit][k] = x;
      update();
      if (!S.playing) renderParams();
      return;
    }
    if (!S.paused && ANIM.has(S.exp.viz)) { S.clock += dt; drawViz(); }
  }

  /* ---------- parameters ---------- */
  function prmHTML(d, x) {
    const locked = d.constant && !S.brk;
    const off = outOfRange(d, x) && !(d.constant && x === M.C[d.constant].value);
    const di = U.unit(d.dimv);
    let extra = '';
    if (d.constant) {
      const c = M.C[d.constant];
      extra += '<span>Naturkonstante · ' + esc(M.KIND_LABEL[c.kind]) + '</span>';
      if (S.brk) extra += ' <button class="btn sm" data-op="div" data-k="' + d.key + '">÷10</button><button class="btn sm" data-op="mul" data-k="' + d.key + '">×10</button><button class="btn sm" data-op="orig" data-k="' + d.key + '">Originalwert</button>';
      else extra += ' <span class="faint">· im Break-Modus veränderbar</span>';
    } else if (S.brk) {
      extra += '<button class="btn sm" data-op="neg" data-k="' + d.key + '" title="Vorzeichen umkehren">±</button><button class="btn sm" data-op="div" data-k="' + d.key + '">÷10</button><button class="btn sm" data-op="mul" data-k="' + d.key + '">×10</button>';
    }
    if (S.exp.animateVar === d.key) {
      extra += '<button class="btn sm' + (S.playing ? ' on' : '') + '" data-op="play" data-k="' + d.key + '">' + (S.playing ? 'Anhalten' : 'Zeit laufen lassen') + '</button>';
    }
    if (off && !locked) extra += '<span style="color:var(--red)">außerhalb des Slider-Bereichs</span>';
    return '<div class="prm' + (locked ? ' locked' : '') + (off ? ' off' : '') + '" data-k="' + d.key + '">' +
      '<div class="lab2">' + U.tex(d.tex) + '<span class="nm" title="' + esc(d.name) + '">' + esc(d.name) + '</span></div>' +
      '<div class="valbox"><input class="num" data-k="' + d.key + '" value="' + esc(U.fmtInput(x)) + '" inputmode="decimal" spellcheck="false" aria-label="' + esc(d.name) + ' in ' + esc(di || 'Einheit 1') + '"' + (locked ? ' readonly' : '') + '><span class="unit">' + esc(di) + '</span></div>' +
      '<div class="sl"><input type="range" min="0" max="1000" step="1" data-k="' + d.key + '" aria-label="' + esc(d.name) + ' Schieberegler"' + (locked ? ' disabled' : '') + '><span class="scl">' + SCL[d.scale] + '</span></div>' +
      (extra ? '<div class="extra">' + extra + '</div>' : '') +
      '</div>';
  }
  function usedConstants() {
    const f = form();
    const set = new Set();
    const varKeys = new Set(f.c.vars.map((v) => v.key));
    f.c.outputs.forEach((o) => E.symbolsIn(o.ast).forEach((s) => { if (M.C[s] && !varKeys.has(s) && M.C[s].kind !== 'math') set.add(s); }));
    return [...set];
  }
  function renderParams() {
    const box = $('#prms');
    if (!box) return;
    const f = form();
    const vals = S.vals[S.edit];
    box.innerHTML = f.c.vars.length
      ? f.c.vars.map((d) => prmHTML(d, vals[d.key])).join('')
      : '<p class="muted" style="margin:0;font-size:13px">Keine freien Parameter: Hier rechnen nur Naturkonstanten.' + (S.brk ? ' Unten kannst du sie verstellen.' : ' Im Break-Modus kannst du sie verstellen.') + '</p>';
    const cb = $('#cprms');
    if (S.brk) {
      const cs = usedConstants();
      const cv = S.consts[S.edit];
      cb.innerHTML = cs.length ? '<div class="side-lbl" style="margin-top:14px">Naturkonstanten in diesen Formeln</div>' + cs.map((k) => {
        const c = M.C[k];
        const x = k in cv ? cv[k] : c.value;
        const changed = k in cv && Math.abs(x / c.value - 1) > 1e-12;
        return '<div class="prm' + (changed ? ' off' : '') + '" data-c="' + k + '"><div class="lab2">' + U.tex(c.tex) + '<span class="nm">' + esc(c.name) + '</span></div>' +
          '<div class="valbox"><input class="num" data-c="' + k + '" value="' + esc(U.fmtInput(x)) + '" inputmode="decimal" aria-label="' + esc(c.name) + '"><span class="unit">' + esc(U.unit(c.dimv)) + '</span></div>' +
          '<div class="extra"><button class="btn sm" data-cop="div" data-c="' + k + '">÷10</button><button class="btn sm" data-cop="mul" data-c="' + k + '">×10</button><button class="btn sm" data-cop="orig" data-c="' + k + '">Originalwert</button>' + (changed ? '<span style="color:var(--red)">verändert: ×' + esc(E.fmt(x / c.value, 3)) + '</span>' : '') + '</div></div>';
      }).join('') : '';
    } else cb.innerHTML = '';
    syncInputs();
  }
  function syncInputs() {
    const vals = S.vals[S.edit];
    $$('#prms input[type=range]').forEach((r) => {
      const d = S.exp.vars[r.dataset.k];
      const p = toPos(d, vals[d.key]) * 1000;
      r.value = String(Math.round(p));
      r.style.setProperty('--p', (p / 10) + '%');
    });
    $$('#prms input.num').forEach((i) => {
      if (i === document.activeElement) return;
      i.value = U.fmtInput(vals[i.dataset.k]);
      i.classList.remove('bad');
    });
  }
  function setVal(k, x, fromSlider) {
    const d = S.exp.vars[k];
    const vals = S.vals[S.edit];
    if (!S.brk && !fromSlider) {
      if (d.constant) return false;
      if (d.integer) x = Math.round(x);
      const clamped = Math.min(d.max, Math.max(d.min, x));
      if (clamped !== x) U.toast(d.label + ': regulärer Bereich ' + E.fmt(d.min, 3) + ' … ' + E.fmt(d.max, 3) + ' – im Break-Modus frei');
      x = clamped;
    }
    const wasOff = outOfRange(d, vals[k]);
    vals[k] = x;
    if (S.preset !== null) { S.preset = null; const n = $('#pnote'); if (n) n.textContent = ''; $$('.presets .chip').forEach((c) => c.classList.remove('on')); }
    if (wasOff !== outOfRange(d, x) && S.brk) { renderParams(); }
    if (fromSlider) scheduleUpdate(); else update();
    return true;
  }
  let pending = false;
  function scheduleUpdate() {
    if (typeof requestAnimationFrame !== 'function') return update();
    if (pending) return;
    pending = true;
    requestAnimationFrame(() => { pending = false; update(); });
  }
  function onLabInput(e) {
    const t = e.target;
    if (t.type === 'range' && t.dataset.k) {
      const d = S.exp.vars[t.dataset.k];
      setVal(d.key, fromPos(d, Number(t.value) / 1000), true);
    }
  }
  function commitNum(t) {
    const x = U.parseNum(t.value);
    if (x === null) { t.classList.add('bad'); t.title = 'Nicht lesbar. Beispiele: 6.674e-11 · 1,5 · 3×10^8 · 2*M_sun'; return; }
    t.classList.remove('bad'); t.title = '';
    if (t.dataset.c) { S.consts[S.edit][t.dataset.c] = x; renderParams(); update(); return; }
    const d = S.exp.vars[t.dataset.k];
    if (!S.brk && d.positive && !(x > 0)) { t.classList.add('bad'); U.toast(d.label + ' muss positiv sein – im Break-Modus erlaubt'); return; }
    setVal(t.dataset.k, x, false);
    t.value = U.fmtInput(S.vals[S.edit][t.dataset.k]);
  }
  function onLabChange(e) {
    const t = e.target;
    if (t.classList.contains('num')) commitNum(t);
    else if (t.dataset.vo) { S.vizOpts[t.dataset.vo] = t.checked; drawViz(); }
    else if (t.dataset.g) onGraphSelect(t);
  }
  function onLabKey(e) {
    if (e.key === 'Enter' && e.target.classList.contains('num')) { e.preventDefault(); commitNum(e.target); }
  }
  function onLabBlur(e) {
    const t = e.target;
    if (t.classList && t.classList.contains('num') && !t.classList.contains('bad')) {
      const v = t.dataset.c ? (S.consts[S.edit][t.dataset.c] ?? M.C[t.dataset.c].value) : S.vals[S.edit][t.dataset.k];
      t.value = U.fmtInput(v);
    }
  }
  function onLabClick(e) {
    const b = e.target.closest('button');
    if (!b) return;
    const vals = S.vals[S.edit];
    if (b.dataset.preset !== undefined) {
      const p = S.exp.presets[Number(b.dataset.preset)];
      Object.assign(vals, p.values);
      S.consts[S.edit] = {};
      S.base = { vals: Object.assign({}, vals), consts: {}, form: S.form };
      S.preset = p;
      S.playing = false;
      $$('.presets .chip').forEach((c) => c.classList.toggle('on', c === b));
      const n = $('#pnote'); if (n) n.textContent = p.note ? p.note : '';
      renderParams(); update();
    } else if (b.dataset.op) {
      const k = b.dataset.k, d = S.exp.vars[k];
      if (b.dataset.op === 'play') {
        if (S.playing) S.playing = false;
        else {
          let lim = d.max;
          const r = S.exp.animateUntil && S.res[S.edit].out[S.exp.animateUntil];
          if (r && r.ok && r.value > 0) lim = Math.min(lim, r.value);
          if (vals[k] >= lim - 1e-9 || vals[k] < d.min) vals[k] = d.min;
          S.playing = true;
        }
        renderParams(); return;
      }
      let x = vals[k];
      if (b.dataset.op === 'mul') x *= 10;
      else if (b.dataset.op === 'div') x /= 10;
      else if (b.dataset.op === 'neg') x = -x;
      else if (b.dataset.op === 'orig') x = M.C[d.constant].value;
      vals[k] = x;
      renderParams(); update();
    } else if (b.dataset.cop) {
      const k = b.dataset.c, c = M.C[k], cv = S.consts[S.edit];
      const x = k in cv ? cv[k] : c.value;
      if (b.dataset.cop === 'orig') delete cv[k];
      else cv[k] = b.dataset.cop === 'mul' ? x * 10 : x / 10;
      renderParams(); update();
    } else if (b.dataset.form) {
      S.form = b.dataset.form;
      S.graph = U.defaultGraph(S.exp, S.form);
      S.base = { vals: Object.assign({}, S.vals.A), consts: Object.assign({}, S.consts.A), form: S.form };
      S.preset = null;
      U.render(false);
    } else if (b.dataset.edit) {
      S.edit = b.dataset.edit;
      S.playing = false;
      $$('[data-edit]').forEach((x) => x.classList.toggle('on', x === b));
      const h = $('#lab .ph h3'); if (h) h.textContent = 'Visualisierung · Satz ' + S.edit;
      renderParams(); update();
    } else if (b.dataset.gx) {
      S.graph.xlog = b.dataset.gx === 'log'; renderGraphPanel(); updatePlots(); U.writeHash();
    } else if (b.dataset.gy) {
      S.graph.ylog = b.dataset.gy === 'log'; renderGraphPanel(); updatePlots(); U.writeHash();
    } else if (b.dataset.gz) {
      const z = b.dataset.gz;
      S.plots.forEach((p, i) => { if (z === 'reset') p.reset(i > 0); else if (i === 0) p.zoom(z === 'in' ? 0.7 : 1.4); });
    } else if (b.dataset.gextra) {
      const k = b.dataset.gextra, ex = S.graph.extra;
      const i = ex.indexOf(k);
      if (i >= 0) ex.splice(i, 1); else ex.push(k);
      renderGraphPanel(); updatePlots(); U.writeHash();
    }
  }

  /* ---------- results + status ---------- */
  function renderResults() {
    const box = $('#res');
    if (!box) return;
    const f = form();
    const outs = f.c.outputs;
    const prim = outs.find((o) => o.primary) || outs[0];
    const A = S.res.A;
    let h = '';
    if (!S.cmp) {
      const r = A.out[prim.key];
      const dg = digitsFor(prim, 'A');
      const v = fmtR(r, dg.d);
      const di = E.dimInfo(prim.dimv);
      h += '<div class="rp"><div class="line">' + U.tex(prim.tex) + '<span class="mo">=</span>' +
        (v === null ? '<span class="v" style="color:var(--red)">nicht definiert</span>' : '<span class="v">' + esc(v) + '</span><span class="u">' + esc(U.unit(prim.dimv)) + '</span>') + '</div>';
      const alt = altR(prim, r);
      const meta = [];
      if (alt) meta.push('= ' + alt);
      if (di.name) meta.push(di.name);
      if (U.unit(prim.dimv) && di.si !== U.unit(prim.dimv)) meta.push('SI: ' + di.si);
      if (dg.u && dg.u.rel > 0) meta.push('rel. Unsicherheit ≈ ' + E.fmt(dg.u.rel, 2) + ' (aus ' + dg.u.parts.map((p) => p.key).join(', ') + ')');
      else if (dg.u && !Object.keys(S.consts.A).length) meta.push('keine Unsicherheit aus Konstanten');
      h += '<div class="meta">' + esc(meta.join(' · ')) + '</div>';
      if (S.baseRes && r && r.ok) {
        const q = ratio(S.baseRes.out[prim.key], r);
        h += '<div class="delta">gegenüber ' + (S.preset ? 'Preset' : 'Ausgangswert') + ': ' + esc(q.t) + (q.p ? '  (' + esc(q.p) + ')' : '') + '</div>';
      }
      h += '</div>';
      h += '<table class="t rlist"><tbody>' + outs.filter((o) => o !== prim).map((o) => {
        const rr = A.out[o.key];
        const vv = fmtR(rr, digitsFor(o, 'A').d);
        const alt2 = altR(o, rr);
        return '<tr><td class="k">' + U.tex(o.tex) + '</td><td class="nm">' + esc(o.name) + (o.note ? '<br><span class="faint">' + esc(o.note) + '</span>' : '') + '</td>' +
          (vv === null ? '<td class="val err">nicht definiert</td>' : '<td class="val">' + esc(vv) + ' ' + esc(U.unit(o.dimv)) + (alt2 ? '<span class="alt">' + esc(alt2) + '</span>' : '') + '</td>') + '</tr>';
      }).join('') + '</tbody></table>';
    } else {
      const B = S.res.B;
      h += '<div class="scroll-x"><table class="t rlist cmp"><thead><tr><th>Größe</th><th>A</th><th>B</th><th>B / A</th></tr></thead><tbody>' + outs.map((o) => {
        const ra = A.out[o.key], rb = B.out[o.key];
        const d = Math.min(digitsFor(o, 'A').d, 5);
        const va = fmtR(ra, d), vb = fmtR(rb, d);
        const q = ratio(ra, rb);
        const u = U.unit(o.dimv);
        return '<tr><td class="k">' + U.tex(o.tex) + (o.primary ? ' <span class="faint">★</span>' : '') + '</td>' +
          '<td class="val">' + (va === null ? '<span style="color:var(--red)">undef.</span>' : esc(va)) + '</td>' +
          '<td class="val">' + (vb === null ? '<span style="color:var(--red)">undef.</span>' : esc(vb)) + '</td>' +
          '<td class="ratio">' + esc(q.t) + '<br><span class="faint">' + esc(q.p) + '</span></td></tr>' +
          (u ? '' : '');
      }).join('') + '</tbody></table></div>';
      const diffs = form().c.vars.filter((v) => S.vals.A[v.key] !== S.vals.B[v.key]);
      h += '<div class="meta faint" style="font-size:12px;margin-top:8px">Einheiten wie in der Einzelansicht. ' +
        (diffs.length ? 'Unterschiede: ' + diffs.map((v) => esc(v.label) + ' ' + esc(ratio({ ok: true, ...E.mk(S.vals.A[v.key]) }, { ok: true, ...E.mk(S.vals.B[v.key]) }).t)).join(', ') : 'A und B sind noch identisch – wähle „Satz B“ und verändere einen Wert.') + '</div>';
    }
    box.innerHTML = h;
  }

  function collectIssues() {
    const list = [];
    const seen = new Set();
    const add = (i, pre) => {
      const key = i.cat + i.msg;
      if (seen.has(key)) return;
      seen.add(key);
      list.push(Object.assign({}, i, { msg: (pre || '') + i.msg }));
    };
    S.res.A.issues.forEach((i) => add(i, S.cmp ? 'A: ' : ''));
    if (S.cmp) S.res.B.issues.forEach((i) => { if (!S.res.A.issues.some((j) => j.msg === i.msg)) add(i, 'B: '); });
    list.sort((a, b) => CAT_ORDER.indexOf(a.cat) - CAT_ORDER.indexOf(b.cat));
    return list;
  }
  function renderStatus() {
    const box = $('#stat');
    if (!box) return;
    const list = collectIssues();
    const has = (c) => list.some((i) => i.cat === c);
    const chips = [
      ['math', 'Mathematisch definiert', 'Mathematisch undefiniert', ''],
      ['numeric', 'Numerisch unauffällig', 'Numerik abgefangen', 'soft'],
      ['unreal', 'Physikalisch realistisch', 'Physikalisch unrealistisch', ''],
      ['model', 'Im Gültigkeitsbereich', 'Außerhalb des Modells', ''],
    ];
    let h = '<div class="stat">' + chips.map(([c, ok, bad, cls]) => '<div class="st ' + (has(c) ? 'warn ' + cls : '') + '">' + (has(c) ? bad : ok) + '</div>').join('') + '</div>';
    h += '<ul class="issues">' + list.map((i) => '<li class="' + i.cat + '"><b>' + CAT[i.cat] + '</b>' + esc(i.msg) + '</li>').join('') + '</ul>';
    box.innerHTML = h;
  }

  /* ---------- visualization ---------- */
  function sizeCanvas(c) {
    const dpr = globalThis.devicePixelRatio || 1;
    const W = c.clientWidth || 640, H = c.clientHeight || 330;
    if (c.width !== Math.round(W * dpr) || c.height !== Math.round(H * dpr)) { c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); }
    const ctx = c.getContext && c.getContext('2d');
    if (ctx) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { ctx, W, H };
  }
  function drawViz() {
    const c = $('#vizc');
    if (!c || !S.res.A) return;
    const { ctx, W, H } = sizeCanvas(c);
    if (!ctx) return;
    ctx.clearRect(0, 0, W, H);
    const fn = PP.viz[S.exp.viz];
    if (!fn) return;
    const res = S.res[S.edit] || S.res.A;
    // Values beyond the double range are clamped for drawing only: they are defined, just huge/tiny
    const o = (k) => {
      const r = res.out[k];
      if (!r || !r.ok) return NaN;
      if (r.s === 0) return 0;
      if (r.l > 308) return r.s * 1.7e308;
      if (r.l < -307) return r.s * 1e-307;
      return E.toDouble(U.num(r));
    };
    const fo = (k, abs) => { const r = res.out[k]; if (!r || !r.ok) return '—'; const n = U.num(r); if (abs && n.s < 0) { n.s = 1; n.d = Math.abs(n.d); } return E.fmt(n, 3); };
    try { fn(ctx, W, H, { v: S.vals[S.edit], o, fo, col: PP.colors(), t: S.clock, opts: S.vizOpts }); }
    catch (err) {
      const col = PP.colors();
      ctx.fillStyle = col.red; ctx.font = '13px ' + col.sans; ctx.textAlign = 'center';
      ctx.fillText('Für diese Werte gibt es keine sinnvolle Darstellung.', W / 2, H / 2);
    }
  }

  /* ---------- graph ---------- */
  function plotSpecs() {
    const g = S.graph;
    if (!g) return [];
    const outs = form().c.outputs;
    const y = outs.find((o) => o.key === g.y);
    const same = g.extra.filter((k) => { const o = outs.find((x) => x.key === k); return o && k !== g.y && E.dimEq(o.dimv, y.dimv); });
    const other = g.extra.filter((k) => { const o = outs.find((x) => x.key === k); return o && k !== g.y && !E.dimEq(o.dimv, y.dimv); });
    return [{ ys: [g.y].concat(same), ylog: g.ylog }].concat(other.map((k) => ({ ys: [k], ylog: g.ylog, small: true })));
  }
  function renderGraphPanel() {
    const p = $('#gpanel');
    if (!p) return;
    const g = S.graph, f = form();
    const xv = S.exp.vars[g.x];
    const opt = (list, cur) => list.map((o) => '<option value="' + o.key + '"' + (o.key === cur ? ' selected' : '') + '>' + esc(o.sym || o.label) + ' – ' + esc(o.name) + '</option>').join('');

      ctx.font = '12.5px ' + C.mono; ctx.lineCap = 'round'; ctx.lineJoin = 'round';

      const B = narrow ? { x: 44, y: H * 0.58 + 22, w: W - 60, h: H * 0.42 - 44 } : { x: W * 0.6 + 56, y: 22, w: W * 0.4 - 72, h: H - 58 };
      // --- Bahn ---
      const ymin = -2.2, ymax = 7.2;
      const sx = A.w / (D + 1), sy = A.h / (ymax - ymin), sc = Math.min(sx, sy);
      const ox = A.x + (A.w - D * sc) / 2, oy = A.y + A.h - (0 - ymin) * sc;

      ctx.beginPath(); ctx.moveTo(A.x, oy); ctx.lineTo(A.x + A.w, oy); ctx.stroke();
      const path = (e1, e2) => {
        ctx.beginPath();

          const tt = TT * i / 120;

          if (i) ctx.lineTo(...p); else ctx.moveTo(...p);
        }
        ctx.stroke();
      };
      // Geisterwege: ein Fächer möglicher Wege
      ctx.save(); ctx.globalAlpha = 0.14; ctx.strokeStyle = C.ink2; ctx.lineWidth = 1;
      for (let k = -4; k <= 4; k++) if (k) path(k * 0.45, (k % 2) * 0.5);
      ctx.restore();
      ctx.save(); ctx.setLineDash([5, 5]); ctx.strokeStyle = C.accent; ctx.lineWidth = 1.6; path(0, 0); ctx.restore();
      ctx.strokeStyle = C.cyan; ctx.lineWidth = 2.4; path(st.e1, st.e2);
      // Ball, der den Probeweg abfliegt
      const ph = (st.clock * 0.5) % 1, tb = ph * TT;
      const pb = P(D * tb / TT, yTrue(tb) + st.e1 * Math.sin(Math.PI * tb / TT) + st.e2 * Math.sin(2 * Math.PI * tb / TT));
      ctx.fillStyle = C.cyan; ctx.beginPath(); ctx.arc(pb[0], pb[1], 5, 0, 7); ctx.fill();
      ctx.fillStyle = C.ink; [P(0, 0), P(D, 0)].forEach((p) => { ctx.beginPath(); ctx.arc(p[0], p[1], 4, 0, 7); ctx.fill(); });
      ctx.fillStyle = C.ink3; ctx.fillText('Start', P(0, 0)[0] - 14, oy + 16); ctx.fillText('Ziel', P(D, 0)[0] - 12, oy + 16);
      ctx.fillStyle = C.accent; ctx.fillText('echte Bahn', ...P(D * 0.5 - 1.3, yTrue(1) + 0.35));
      // --- S(ε1) ---
      const eMax = EM, sAt = (e) => dS(e, st.e2);
      const top = Math.max(sAt(eMax), 1e-9) * 1.08;

      ctx.strokeStyle = C.ink3; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(B.x, B.y); ctx.lineTo(B.x, B.y + B.h); ctx.lineTo(B.x + B.w, B.y + B.h); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(X(0), B.y + B.h); ctx.lineTo(X(0), B.y + B.h + 4); ctx.stroke();
      ctx.fillStyle = C.ink3;
      ctx.fillText('ε₁', B.x + B.w - 12, B.y + B.h + 16); ctx.fillText('0', X(0) - 3, B.y + B.h + 16);

      for (let i = 0; i <= 80; i++) { const e = -eMax + 2 * eMax * i / 80; const p = [X(e), Y(sAt(e))]; if (i) ctx.lineTo(...p); else ctx.moveTo(...p); }

      ctx.fillStyle = C.cyan; ctx.beginPath(); ctx.arc(pc[0], pc[1], 5, 0, 7); ctx.fill();

    }
    function readout(Sc) {
      const h =
        '<div><span class="faint">Wirkung echte Bahn</span> S = ' + f(S0) + ' J·s</div>' +
        '<div><span class="faint">Wirkung Probeweg</span> S = <b>' + f(Sc) + '</b> J·s</div>' +
        '<div class="inv"><span class="faint">Unterschied</span> ΔS = ' + f(Sc - S0) + ' J·s ' + (Sc - S0 < 1e-6 ? '← kleinster Wert' : '≥ 0') + '</div>' +
        '<div><span class="faint">Formel</span> S = ∫ (E<sub>kin</sub> − E<sub>pot</sub>) dt <span class="faint">· Vorzeichen egal, es zählt der Vergleich</span></div>';

    function step(dt) {

      st.clock += dt;

        st.e1 = 1.7 * Math.sin(st.clock * 0.55);

      }

    }
    const onSlide = () => {
      st.playing = false;
      st.e1 = -EM + 2 * EM * s1.value / 1000;
      st.e2 = -EM + 2 * EM * s2.value / 1000;
      sync(); draw();
    };
    s1.addEventListener('input', onSlide); s2.addEventListener('input', onSlide);
    play.addEventListener('click', () => {
      st.playing = !st.playing;
      if (st.playing) st.clock = Math.asin(Math.max(-1, Math.min(1, st.e1 / 1.7))) / 0.55;

  let redrawHook = null;

  /* ================== Abschnitt: Einstein-Hilbert-Wirkung ================== */
  const ACTION = {
    id: 'action', title: 'Die Einstein-Hilbert-Wirkung: die ART in einer Zeile',
    mount: mountAct,
    body: () =>
      '<p>Die Feldgleichungen kann man auch ganz anders gewinnen: nicht als Gleichung, die man aufstellt, sondern als Folge eines einzigen Prinzips. Es ist dasselbe Prinzip, das die gesamte Physik durchzieht.</p>' +
      '<h3 class="th-h3">Das Prinzip der kleinsten Wirkung</h3>' +
      '<p>Man ordnet jedem denkbaren Weg eines Systems eine Zahl zu, die <b>Wirkung</b> ' + t('S') + '. In der Mechanik ist das die über die Zeit aufsummierte Differenz aus Bewegungs- und Lageenergie:</p>' +
      d(R`S = \int \left(E_{\text{kin}} - E_{\text{pot}}\right) dt`) +
      '<p>Die Natur wählt den Weg, bei dem ' + t('S') + ' <b>stationär</b> ist – kleine Änderungen am Weg ändern ' + t('S') + ' in erster Ordnung nicht. Meist ist das ein Minimum. Aus dieser einen Forderung folgt ' + t('F = ma') + ', ohne dass man Kräfte als Pfeile zeichnen muss. Probier es mit einem geworfenen Ball: Jede Verformung der echten Bahn macht die Wirkung größer.</p>' +
      actHTML() +
      '<p>Das Diagramm daneben zeigt die Wirkung in Abhängigkeit von der Beule ' + t(R`\varepsilon_1`) + '. Die Kurve hat ihr Minimum genau bei null, also bei der echten Wurfparabel. Die Welle hebt die ganze Kurve zusätzlich an – jede Abweichung kostet.</p>' +
      '<p>Für diesen Wurf lässt sich das sogar exakt ausrechnen. Mit der Masse ' + t('m') + ' und der Flugzeit ' + t(R`\tau = 2\,\mathrm{s}`) + ' gilt</p>' +
      d(R`\Delta S = S - S_{\text{echt}} = \frac{m\,\pi^{2}}{4\,\tau}\left(\varepsilon_1^{2} + 4\,\varepsilon_2^{2}\right)`) +
      '<p>Warum so einfach? Alle Beiträge, die linear in den ' + t(R`\varepsilon`) + ' sind, fallen weg, weil die echte Bahn die Bewegungsgleichung erfüllt – genau das bedeutet „stationär“. Und weil die Schwerkraft hier konstant ist, wächst die Lageenergie nur linear mit der Höhe und liefert keinen weiteren Term. Übrig bleibt allein die zusätzliche Bewegungsenergie der Verformung, und die ist nie negativ. Deshalb ist die echte Bahn hier nicht nur stationär, sondern ein echtes Minimum. Beule und Welle stören sich dabei nicht: Das Produkt ihrer Geschwindigkeitsanteile mittelt sich über den Flug zu null. Die Welle verschiebt die Parabel deshalb nur nach oben, ihr Tiefpunkt bleibt bei ' + t(R`\varepsilon_1 = 0`) + '.</p>' +
      '<p>Dass die Natur einem solchen Prinzip folgt, ist kein Zufall der Mechanik. Licht nimmt den Weg kürzester Laufzeit (Fermat), Felder gehorchen Wirkungsprinzipien, und in der Quantenmechanik summiert Feynman über <i>alle</i> Wege, jeweils gewichtet mit ' + t(R`e^{iS/\hbar}`) + '. Der klassische Weg ist der, bei dem sich die Nachbarwege nicht gegenseitig auslöschen.</p>' +
      '<h3 class="th-h3">Die Wirkung der Raumzeit</h3>' +
      '<p>1915 fragte David Hilbert: Welche Wirkung hat die Geometrie selbst? Seine Antwort, die <b>Einstein-Hilbert-Wirkung</b>:</p>' +
      d(R`S = \frac{c^{3}}{16\pi G}\int R\,\sqrt{-g}\;d^{4}x \;+\; S_{\text{Materie}}`) +
      '<div class="th-scroll"><table class="t th-cmp"><tbody>' +
      [[t('R'), 'Ricci-Skalar – die Krümmung an jedem Punkt, zu einer einzigen Zahl zusammengefasst (siehe ' + sec('tensor', 'Kette von der Metrik zur Krümmung') + ')'],
        [t(R`\sqrt{-g}`), 'Wurzel aus (minus) der Determinante der Metrik. Sie misst, wie groß ein Stück Raumzeit wirklich ist, und macht das Integral unabhängig von der Wahl der Koordinaten'],
        [t(R`d^{4}x`), 'über die ganze Raumzeit integrieren – Raum <i>und</i> Zeit'],
        [t(R`\frac{c^{3}}{16\pi G}`), 'Umrechnungsfaktor von Geometrie in Wirkung; hier steckt die Stärke der Gravitation'],
        [t(R`S_{\text{Materie}}`), 'die Wirkung von allem, was in der Raumzeit steckt – Teilchen, Felder, Licht']]
        .map(([a, b]) => '<tr><td style="white-space:nowrap">' + a + '</td><td>' + b + '</td></tr>').join('') +
      '</tbody></table></div>' +
      '<p>Man verlangt nun, dass ' + t('S') + ' stationär ist, wenn man die Metrik ' + t(R`g_{\mu\nu}`) + ' ein klein wenig verändert – genau wie beim Ball, nur dass jetzt statt einer Bahn die Geometrie selbst „verbogen“ wird. Heraus kommen die Feldgleichungen:</p>' +
      d(R`\frac{\delta S}{\delta g^{\mu\nu}} = 0 \quad\Rightarrow\quad G_{\mu\nu} = \frac{8\pi G}{c^{4}}\, T_{\mu\nu}`) +
      '<p>Die linke Seite stammt aus dem Krümmungsteil, die rechte aus der Variation der Materiewirkung: So ist ' + t(R`T_{\mu\nu}`) + ' eigentlich definiert. Eine kosmologische Konstante erhält man, indem man ' + t('R') + ' durch ' + t(R`R - 2\Lambda`) + ' ersetzt.</p>' +
      '<h3 class="th-h3">Warum gerade R?</h3>' +
      '<p>' + t('R') + ' ist der einfachste Skalar, den man aus der Krümmung bauen kann. Dass die Wahl nicht willkürlich ist, zeigte David Lovelock 1971: In vier Dimensionen sind Einsteins Gleichungen (mit ' + t(R`\Lambda`) + ') die <b>einzig möglichen</b> Feldgleichungen, die nur von der Metrik und ihren ersten beiden Ableitungen abhängen. Wer mehr will, braucht zusätzliche Felder, höhere Ableitungen oder mehr Dimensionen.</p>' +
      '<h3 class="th-h3">Dimensionsanalyse: Hier wartet die Planck-Länge</h3>' +
      '<p>Mit ' + t(R`x^{0} = ct`) + ' hat ' + t(R`d^{4}x`) + ' die Dimension ' + t(R`\mathrm{L}^{4}`) + ' und die Krümmung ' + t('R') + ' die Dimension ' + t(R`\mathrm{L}^{-2}`) + '. Das Integral ist also eine Fläche. Der Vorfaktor ' + t(R`c^{3}/G`) + ' hat die Dimension ' + t(R`\mathrm{M}\,\mathrm{T}^{-1}`) + ', und zusammen ergibt das ' + t(R`\mathrm{M}\,\mathrm{L}^{2}\,\mathrm{T}^{-1}`) + ' = J·s – genau die Einheit einer Wirkung und dieselbe wie die von ' + t(R`\hbar`) + '. Teilt man durch ' + t(R`\hbar`) + ', wie es die Quantentheorie im Exponenten ' + t(R`e^{iS/\hbar}`) + ' verlangt, bleibt</p>' +
      d(R`\frac{S}{\hbar} = \frac{1}{16\pi}\,\frac{1}{l_P^{2}}\int R\,\sqrt{-g}\;d^{4}x \qquad l_P^{2} = \frac{\hbar G}{c^{3}}`) +
      '<p>Die Wirkung der Raumzeit zählt Krümmung in Einheiten der Planck-Fläche. Solange Krümmungsradien riesig gegen ' + t(R`l_P \approx 1{,}6 \times 10^{-35}\,\mathrm{m}`) + ' sind, ist ' + t(R`S/\hbar`) + ' gigantisch, ein einziger klassischer Weg dominiert, und die Geometrie verhält sich klassisch. Erst wenn die Krümmung auf der Planck-Skala liegt, wird ' + t(R`S \sim \hbar`) + ', und viele Geometrien tragen gleichberechtigt bei – die Raumzeit selbst müsste „quanteln“. Genau dort beginnt das Problem aus ' + sec('gap', 'Abschnitt „Warum beide nicht zusammenpassen“') + '. ' + exp('planck', 'Zu den Planck-Einheiten') + '.</p>' +
      '<div class="honest"><b>Einordnung:</b> Die Einstein-Hilbert-Wirkung ist klassisch hervorragend bestätigt – sie <i>ist</i> die ART. Die Summe über alle Geometrien (' + t(R`\int \mathrm{D}g\; e^{iS/\hbar}`) + ') ist dagegen ein formaler Ausdruck, den bisher niemand im Allgemeinen sauber definieren oder ausrechnen kann.</div>',
  };

  const TL = [
    ['1896–1900', 'Einstein studiert an der ETH Zürich. Einer seiner Mathematikprofessoren ist <b>Hermann Minkowski</b>. Einstein schwänzt viele Vorlesungen – Minkowski soll sich später gewundert haben, dass ausgerechnet dieser Student so etwas zustande bringt.'],

    ['1905–1906', 'Unabhängig davon benennt <b>Henri Poincaré</b> die Lorentz-Transformationen, zeigt, dass sie eine Gruppe bilden, und findet die Größe ' + t(R`x^{2} + y^{2} + z^{2} - c^{2}t^{2}`) + ', die dabei unverändert bleibt. Er rechnet sogar mit einer imaginären Zeit als vierter Koordinate – denkt das aber nicht als Geometrie zu Ende.'],

  const HISTORY = {
    id: 'history', title: 'Die Köpfe hinter der ART',
    body: () =>
      '<p>Die ART gilt als Einsteins Werk, und das zu Recht. Aber sie steht auf Fundamenten, die andere gegossen haben – und die gehen oft vergessen.</p>' +
      '<h3 class="th-h3">Henri Poincaré – der Vorläufer</h3>' +
      '<p>Der französische Mathematiker Henri Poincaré war an vielen Stellen schneller als Einstein und Minkowski. In seiner Arbeit über die Dynamik des Elektrons (Kurzfassung im Juni 1905, die ausführliche Fassung erschien 1906) gab er den Lorentz-Transformationen ihren Namen und zeigte, dass sie eine mathematische Gruppe bilden. Er bemerkte, dass dabei die Kombination</p>' +
