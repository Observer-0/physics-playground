<!doctype html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Physics Playground</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪐</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=STIX+Two+Text:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
/* Physics Playground — styles */
:root {
  --bg: #0a0d11; --panel: #10151b; --panel2: #161c24; --line: #222b36; --line2: #2e3844;
  --grid: rgba(140, 162, 190, 0.075);
  --ink: #e7ebf0; --ink2: #9ba7b4; --ink3: #5e6976;
  --accent: #f3b34c; --accent-soft: rgba(243, 179, 76, 0.12);
  --cyan: #62c6d4; --red: #ef6a6a; --red-soft: rgba(239, 106, 106, 0.1);
  --green: #7fcf93; --violet: #b69cf2; --violet-soft: rgba(182, 156, 242, 0.1);
  --font-sans: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --font-math: "STIX Two Text", "STIX Two Math", "Cambria Math", "Times New Roman", serif;
  --r: 6px;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; } }
:root[data-theme="dark"] { color-scheme: dark; }
:root[data-theme="light"] {
  --bg: #f3f4f1; --panel: #ffffff; --panel2: #eaece7; --line: #d7dad3; --line2: #c3c7bf;
  --grid: rgba(40, 50, 60, 0.07);
  --ink: #14181d; --ink2: #4b5560; --ink3: #8a939c;
  --accent: #a8650a; --accent-soft: rgba(168, 101, 10, 0.1);
  --cyan: #137f8e; --red: #c03838; --red-soft: rgba(192, 56, 56, 0.08);
  --green: #2a8744; --violet: #6446bd; --violet-soft: rgba(100, 70, 189, 0.08);
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font-sans); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--cyan); }
::selection { background: var(--accent-soft); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink2); }
.faint { color: var(--ink3); }
[hidden] { display: none !important; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 244px minmax(0, 1fr); min-height: 100vh; }
.side { border-right: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; }
.brand { padding: 18px 18px 14px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid var(--line); }
.brand svg { flex: none; }
.brand b { display: block; font-size: 15px; letter-spacing: -0.01em; }
.brand span { display: block; font-size: 11.5px; color: var(--ink3); }
.nav { padding: 10px 8px 16px; flex: 1; }
.nav h6 { margin: 16px 10px 4px; font-size: 11.5px; font-weight: 500; color: var(--ink3); }
.nav a { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 10px; border-radius: 5px; color: var(--ink2); text-decoration: none; font-size: 13.5px; }
.nav a:hover { background: var(--panel2); color: var(--ink); }
.nav a.on { background: var(--panel2); color: var(--ink); box-shadow: inset 2px 0 0 var(--accent); }
.nav a.hall.on { box-shadow: inset 2px 0 0 var(--violet); }
.nav a small { font-family: var(--font-mono); font-size: 11px; color: var(--ink3); }
.side-foot { padding: 12px 14px 16px; border-top: 1px solid var(--line); display: grid; gap: 10px; }
.switch { display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; font-size: 13px; }
.switch input { appearance: none; width: 30px; height: 17px; border-radius: 9px; background: var(--line2); position: relative; margin: 0; flex: none; transition: background .15s; }
.switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%; background: var(--ink); transition: transform .15s; }
.switch input:checked { background: var(--red); }
.switch input:checked::after { transform: translateX(13px); }
.switch.plain input:checked { background: var(--accent); }
.switch small { display: block; color: var(--ink3); font-size: 11.5px; line-height: 1.3; }
.topbar { display: none; }
/* Sprachumschalter: ein Knopf, die aktive Sprache ist hervorgehoben */
.lang { margin-left: auto; flex: none; display: inline-flex; padding: 2px; gap: 2px; border: 1px solid var(--line2); border-radius: 6px; background: var(--panel); font-family: var(--font-mono); font-size: 11px; line-height: 1; letter-spacing: .04em; }
.brand .lang { margin: 8px 0 0; }
.lang:hover { border-color: var(--ink3); }
.lang:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.brand .lang span, .lang span { display: block; padding: 4px 6px; border-radius: 4px; color: var(--ink3); font-size: 11px; }
.brand .lang span.on, .lang span.on { background: var(--accent-soft); color: var(--accent); }
main { min-width: 0; padding: 22px 28px 60px; }
.brk-banner { border: 1px solid var(--red); background: var(--red-soft); color: var(--ink); border-radius: var(--r); padding: 8px 12px; margin-bottom: 16px; font-size: 13px; }
.brk-banner b { color: var(--red); }

/* ---------- common ---------- */
.btn { border: 1px solid var(--line2); background: var(--panel); border-radius: 5px; padding: 5px 11px; font-size: 13px; color: var(--ink); white-space: nowrap; }
.btn:hover { border-color: var(--ink3); background: var(--panel2); }
.btn.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.btn.sm { padding: 2px 8px; font-size: 12px; }
.btn.icon { padding: 3px 8px; font-family: var(--font-mono); }
.btn:disabled { opacity: .4; cursor: default; }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 5px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 3px 10px; font-size: 12px; color: var(--ink2); }
.seg button + button { border-left: 1px solid var(--line2); }
.seg button.on { background: var(--panel2); color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); }
select { background: var(--panel); border: 1px solid var(--line2); border-radius: 5px; padding: 3px 6px; font-size: 13px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.ph { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 12px; border-bottom: 1px solid var(--line); min-height: 42px; }
.ph h3 { margin: 0; font-size: 13px; font-weight: 500; color: var(--ink2); margin-right: auto; }
.pb { padding: 12px; }
.chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line2); border-radius: 20px; padding: 2px 10px; font-size: 12.5px; background: transparent; color: var(--ink2); }
.chip:hover { color: var(--ink); border-color: var(--ink3); }
.chip.on { color: var(--ink); border-color: var(--accent); }
.chip i { width: 10px; height: 2px; display: inline-block; }
.kbd { font-family: var(--font-mono); font-size: 11.5px; border: 1px solid var(--line2); border-radius: 3px; padding: 0 4px; color: var(--ink2); }
table.t { border-collapse: collapse; width: 100%; font-size: 13px; }
table.t th { text-align: left; font-weight: 500; color: var(--ink3); font-size: 12px; padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t tr:last-child td { border-bottom: 0; }
.scroll-x { overflow-x: auto; }
.callout { border-left: 2px solid var(--cyan); padding: 6px 12px; color: var(--ink2); margin: 12px 0; font-size: 13.5px; }
.callout.warn { border-color: var(--red); }
.callout b { color: var(--ink); font-weight: 500; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 7px 14px; border-radius: 5px; font-size: 13px; z-index: 50; }

/* ---------- experiment header ---------- */
.xhead { display: flex; align-items: flex-end; gap: 20px; flex-wrap: wrap; margin-bottom: 16px; }
.xhead .crumb { font-size: 12.5px; color: var(--ink3); margin-bottom: 2px; }
.xhead h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.15; }
.xhead .sub { color: var(--ink2); font-size: 14px; margin-top: 2px; }
.xhead .eq { font-size: 22px; padding: 2px 0; margin-left: 4px; }
.xhead .acts { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; position: relative; }
.pop { position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; width: min(360px, 90vw); background: var(--panel); border: 1px solid var(--line2); border-radius: var(--r); padding: 12px; box-shadow: 0 12px 30px rgba(0, 0, 0, .35); display: grid; gap: 8px; }
.pop label { font-size: 12px; color: var(--ink3); }
.pop input { width: 100%; background: var(--bg); border: 1px solid var(--line2); border-radius: 4px; padding: 5px 8px; font-family: var(--font-mono); font-size: 12px; }
.pop .row { display: flex; gap: 6px; }

/* ---------- lab layout ---------- */
.lab { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 14px; align-items: start; }
.stage { display: grid; gap: 14px; min-width: 0; }
.vizwrap { position: relative; height: 330px; }
.vizwrap canvas, .plotwrap canvas { width: 100%; height: 100%; display: block; }
.plotwrap { position: relative; height: 300px; touch-action: none; }
.plotwrap.small { height: 190px; }
.plotwrap + .plotwrap { border-top: 1px solid var(--line); }
.tip { position: absolute; pointer-events: none; background: var(--bg); border: 1px solid var(--line2); border-radius: 4px; padding: 5px 8px; font: 12px/1.5 var(--font-mono); color: var(--ink); white-space: nowrap; z-index: 5; }
.tip i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.gsel { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink3); flex-wrap: wrap; }
.legend { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 12px 0; }
.ghint { font-size: 11.5px; color: var(--ink3); padding: 4px 12px 8px; }
.controls { display: grid; gap: 14px; position: sticky; top: 14px; }

.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.presets .chip { border-radius: 4px; }
.pnote { font-size: 12px; color: var(--ink3); margin-top: 8px; min-height: 0; }

.prm { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.prm:last-child { border-bottom: 0; }
.prm .lab2 { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.prm .lab2 .math { font-size: 17px; }
.prm .nm { font-size: 12px; color: var(--ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prm .valbox { display: flex; align-items: center; gap: 4px; justify-self: end; }
.prm input.num { width: 118px; text-align: right; background: var(--bg); border: 1px solid var(--line2); border-radius: 4px; padding: 3px 7px; font-family: var(--font-mono); font-size: 12.5px; }
.prm input.num:focus { outline: none; border-color: var(--accent); }
.prm input.num.bad { border-color: var(--red); }
.prm .unit { font-family: var(--font-mono); font-size: 12px; color: var(--ink2); min-width: 64px; }
.prm .sl { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; }
.prm .sl .scl { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink3); width: 26px; text-align: right; }
.prm .extra { grid-column: 1 / -1; display: flex; gap: 4px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--ink3); }
.prm.locked .num { color: var(--ink2); }
.prm.off input.num { border-color: var(--red); }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; margin: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 3px; background: linear-gradient(to right, var(--accent) var(--p, 0%), var(--line2) var(--p, 0%)); border-radius: 2px; }
input[type=range]::-moz-range-track { height: 3px; background: var(--line2); border-radius: 2px; }
input[type=range]::-moz-range-progress { height: 3px; background: var(--accent); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5.5px; border-radius: 50%; background: var(--ink); border: 3px solid var(--bg); box-shadow: 0 0 0 1px var(--accent); }
input[type=range]::-moz-range-thumb { width: 10px; height: 10px; border-radius: 50%; background: var(--ink); border: 3px solid var(--bg); box-shadow: 0 0 0 1px var(--accent); }
input[type=range]:disabled { opacity: .35; }
input[type=range]:focus-visible { outline: 1px dashed var(--accent); outline-offset: 2px; }

.abbar { display: flex; align-items: center; gap: 8px; }

/* results */
.rp { padding: 4px 0 10px; }
.rp .line { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.rp .line .math { font-size: 22px; }
.rp .v { font-family: var(--font-mono); font-size: 25px; color: var(--accent); letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.rp .u { font-family: var(--font-mono); font-size: 15px; color: var(--ink2); }
.rp .meta { font-size: 12px; color: var(--ink3); margin-top: 3px; }
.rp .delta { font-size: 12.5px; color: var(--ink2); margin-top: 4px; font-family: var(--font-mono); }
.rlist td { font-size: 12.5px; }
.rlist td.k { width: 1%; white-space: nowrap; }
.rlist td.k .math { font-size: 15px; }
.rlist td.val { font-family: var(--font-mono); text-align: right; white-space: nowrap; }
.rlist td.val .alt { display: block; color: var(--ink3); font-size: 11.5px; }
.rlist td.nm { color: var(--ink3); font-size: 12px; }
.rlist td.err { color: var(--red); font-family: var(--font-sans); }
.cmp td.val { color: var(--ink); }
.cmp td.ratio { color: var(--accent); font-family: var(--font-mono); text-align: right; white-space: nowrap; }
.cmp th { text-align: right; }
.cmp th:first-child { text-align: left; }

/* status */
.stat { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.st { border: 1px solid var(--line); border-radius: 4px; padding: 5px 8px; font-size: 12px; display: flex; gap: 7px; align-items: center; color: var(--ink2); }
.st::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex: none; }
.st.warn { border-color: var(--red); color: var(--ink); }
.st.warn::before { background: var(--red); }
.st.soft::before { background: var(--accent); }
.issues { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.issues li { font-size: 12.5px; line-height: 1.45; padding-left: 10px; border-left: 2px solid var(--line2); color: var(--ink2); }
.issues li b { display: block; font-weight: 500; font-size: 11.5px; color: var(--ink3); }
.issues li.math, .issues li.unreal { border-color: var(--red); }
.issues li.math b, .issues li.unreal b { color: var(--red); }
.issues li.model { border-color: var(--accent); }
.issues li.model b { color: var(--accent); }
.issues li.numeric { border-color: var(--violet); }
.issues li.numeric b { color: var(--violet); }
.issues li.info { border-color: var(--cyan); }

/* tabs */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 26px 0 18px; overflow-x: auto; }
.tabs button { background: none; border: 0; padding: 9px 14px; font-size: 14px; color: var(--ink2); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button:hover { color: var(--ink); }
.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
.hallx .tabs button.on { border-bottom-color: var(--violet); }
.tabs button small { color: var(--ink3); margin-left: 6px; font-size: 11.5px; }
.prose { max-width: 760px; }
.prose p { margin: 0 0 12px; }
.lvl { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 8px 22px; margin-bottom: 26px; }
.lvl > .lk { font-size: 12.5px; color: var(--ink3); padding-top: 3px; }
.lvl > .lk b { display: block; color: var(--ink2); font-weight: 500; font-size: 13px; }
.steps { display: grid; gap: 10px; }
.step { display: grid; grid-template-columns: minmax(160px, 240px) minmax(0, 1fr); gap: 16px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.step:last-child { border-bottom: 0; }
.step .d { font-size: 13px; color: var(--ink2); }
.step .math { font-size: 18px; }
.ep { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.ep li { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 12px; font-size: 13.5px; }
.tag { font-size: 11.5px; border-radius: 3px; padding: 1px 7px; border: 1px solid currentColor; justify-self: start; white-space: nowrap; height: fit-content; }
.tag.math { color: var(--cyan); } .tag.model { color: var(--accent); } .tag.approx { color: var(--violet); }
.tag.measured { color: var(--green); } .tag.assume { color: var(--ink2); }
.tag.exact { color: var(--cyan); } .tag.convention, .tag.astro, .tag.cosmo { color: var(--violet); }

/* ---------- math ---------- */
.math { font-family: var(--font-math); font-size: 1.12em; white-space: nowrap; line-height: 1.2; display: inline-block; vertical-align: middle; }
.math i.mi { font-style: italic; padding-right: .02em; }
.math .mu, .math .mn, .math .mrm, .math .mtx { font-style: normal; }
.math .mtx { font-family: var(--font-sans); font-size: .82em; padding: 0 .15em; }
.math .msf { font-family: var(--font-sans); font-size: .86em; font-style: normal; }
.math .mo { padding: 0 .22em; }
.math .mp { padding-right: .18em; }
.math .mfn { padding-right: .08em; }
.math .mfr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; margin: 0 .1em; }
.math .mfr > span { padding: 0 .15em; }
.math .mfr > .mnu { border-bottom: .06em solid currentColor; padding-bottom: .08em; }
.math .mfr > .mde { padding-top: .08em; }
.math .mfr.mt { font-size: .78em; }
.math .msq { display: inline-flex; align-items: stretch; }
.math .mrad { font-size: 1.05em; line-height: 1; padding-right: .02em; align-self: center; }
.math .msqbig .mrad { transform: scaleY(1.9); transform-origin: center; }
.math .msqc { border-top: .06em solid currentColor; padding: .06em .1em 0 .05em; }
.math .msc { display: inline-flex; align-items: center; }
.math .msup, .math .msub { font-size: .7em; line-height: 1; }
.math .msup { align-self: flex-start; margin-top: -.15em; padding-left: .04em; }
.math .msub { align-self: flex-end; margin-bottom: -.2em; padding-left: .02em; }
.math .mss { display: inline-flex; flex-direction: column; font-size: .7em; line-height: 1.05; margin-left: .04em; }
.math .md { font-style: normal; }
.math .mdbig { display: inline-block; transform: scaleY(1.9); padding: 0 .06em; }
.math .mint { font-size: 1.5em; font-style: normal; }
.math .mhat { position: relative; display: inline-block; }
.math .mhat::after { content: "^"; position: absolute; left: 50%; top: -.55em; transform: translateX(-40%); font-size: .8em; font-style: normal; }
.math .msp { display: inline-block; }
.mathd { display: block; text-align: center; font-size: 1.5em; padding: 6px 0; overflow-x: auto; overflow-y: hidden; }

/* ---------- dimension analysis ---------- */
.dimtop { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 8px; }
.honest { font-size: 13px; color: var(--ink2); border: 1px solid var(--line2); border-radius: var(--r); padding: 8px 12px; margin: 0 0 18px; }
.honest b { color: var(--ink); font-weight: 500; }
.deq { border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); margin-bottom: 16px; overflow: hidden; }
.deq > header { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--line); }
.deq > header h4 { margin: 0; font-size: 13.5px; font-weight: 500; margin-right: auto; }
.verdict { font-size: 12.5px; border-radius: 3px; padding: 1px 8px; }
.verdict.ok { color: var(--green); border: 1px solid var(--green); }
.verdict.bad { color: var(--red); border: 1px solid var(--red); }
.deq .eqrow { padding: 14px; font-size: 20px; text-align: center; overflow-x: auto; border-bottom: 1px solid var(--line); }
.deq .body { padding: 12px 14px; display: grid; gap: 14px; }
.side-lbl { font-size: 12px; color: var(--ink3); margin-bottom: 4px; }
.facs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.fac { border: 1px solid var(--line); border-radius: 4px; padding: 6px 9px; display: grid; gap: 2px; background: var(--bg); }
.fac .math { font-size: 17px; }
.fac .arrow { color: var(--ink3); font-size: 12px; }
.fac .dm .math { font-size: 15px; color: var(--cyan); }

<script>
/* ---- src/core/i18n.js ---- */
/* =====================================================================
   Physics Playground — Sprache (Deutsch / Englisch)
   Zwei Werkzeuge, beide ohne DOM, damit sie auch in Node (Tests) laufen:
   · T('Deutsch', 'English') – wählt im Code direkt den passenden Text.
   · localize(obj) – ersetzt in Daten jedes Paar { de: …, en: … } durch einen
     Getter, der immer die aktive Sprache liefert. Code, der die Daten liest
     (exp.title, C.G.name …), muss davon nichts wissen.
   ===================================================================== */
(function (PP) {
  'use strict';
  const LANGS = ['de', 'en'];
  const listeners = [];

  function detect() {
    if (typeof document === 'undefined') return 'de'; // Node: Tests sind auf Deutsch formuliert
    try { const s = JSON.parse(localStorage.getItem('pp.lang')); if (LANGS.includes(s)) return s; } catch (_) { /* gesperrt */ }
    const nav = (typeof navigator !== 'undefined' && (navigator.language || '')) || '';
    return /^de\b/i.test(nav) ? 'de' : 'en';
  }

  const I = (PP.i18n = {
    LANGS,
    lang: detect(),
    T: (de, en) => (I.lang === 'en' ? en : de),
    locale: () => (I.lang === 'en' ? 'en-US' : 'de-DE'),
    // Dezimalzeichen für fertig formatierte Zahlen (toFixed …): 1.5 → „1,5“ auf Deutsch
    dec: (s) => (I.lang === 'en' ? String(s) : String(s).replace('.', ',')),
    set(lang, opts = {}) {
      if (!LANGS.includes(lang) || lang === I.lang) return false;
      I.lang = lang;
      if (!opts.silent) {
        try { localStorage.setItem('pp.lang', JSON.stringify(lang)); } catch (_) { /* gesperrt */ }
        listeners.forEach((f) => f(lang));
      }
      return true;
    },
    // Kurz in einer Sprache arbeiten (Tests), danach zurück – ohne Speichern und ohne Neuzeichnen
    with(lang, fn) {
      const prev = I.lang;
      I.lang = lang;
      try { return fn(); } finally { I.lang = prev; }
    },
    onChange: (f) => listeners.push(f),
    isPair,
    localize,
  });

  function isPair(v) {
    if (!v || typeof v !== 'object' || Array.isArray(v) || Object.getPrototypeOf(v) !== Object.prototype) return false;
    const k = Object.keys(v);
    return k.length === 2 && k.includes('de') && k.includes('en');
  }

  function localize(root, seen = new WeakSet()) {
    if (!root || typeof root !== 'object' || seen.has(root)) return root;
    seen.add(root);
    for (const k of Object.keys(root)) {
      const desc = Object.getOwnPropertyDescriptor(root, k);
      if (!desc || !('value' in desc)) continue; // schon ein Getter
      const v = desc.value;
      if (isPair(v)) {
        Object.defineProperty(root, k, {
          enumerable: true, configurable: true,
          get: () => (I.lang === 'en' ? v.en : v.de),
          // Wer das Feld überschreibt, bekommt wieder einen normalen Wert
          set(x) { Object.defineProperty(root, k, { value: x, writable: true, enumerable: true, configurable: true }); },
        });
      } else if (v && typeof v === 'object') localize(v, seen);
    }
    return root;
  }
})(globalThis.PP = globalThis.PP || {});

/* ---- src/core/engine.js ---- */
/* =====================================================================
   Physics Playground — Formula Engine
   Formula → AST → Dimensions → Evaluation (double + log10 domain)
   Pure logic, no DOM. Runs in the browser and in Node (tests).
   ===================================================================== */
(function (PP) {
  'use strict';

  // Nur eigene Einträge zählen. Sonst wären Namen wie „constructor“ oder „toString“
  // in jedem Objekt „bekannt“ und würden als Konstante, Funktion oder Dimension gelesen.
  const has = (o, k) => o != null && Object.prototype.hasOwnProperty.call(o, k);
  const I = PP.i18n, T = I.T;

  /* ---------- Rational numbers (for exponents like L^-1/2) ---------- */
  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a || 1; }
  function R(n, d = 1) {
    if (d < 0) { n = -n; d = -d; }
    const g = gcd(n, d);
    return { n: n / g, d: d / g };
  }
  const Rz = R(0);
  const radd = (a, b) => R(a.n * b.d + b.n * a.d, a.d * b.d);
  const rmul = (a, b) => R(a.n * b.n, a.d * b.d);
  const rneg = (a) => R(-a.n, a.d);
  const rzero = (a) => a.n === 0;
  const rval = (a) => a.n / a.d;
  function rFromNumber(x, maxDen = 64) {
    if (!isFinite(x)) return null;
    for (let d = 1; d <= maxDen; d++) {
      const n = Math.round(x * d);
      if (Math.abs(n / d - x) < 1e-9) return R(n, d);
    }
    return null;
  }

  /* ---------- Dimensions: exponents of 7 SI base quantities ---------- */
  const BASES = ['M', 'L', 'T', 'Θ', 'I', 'N', 'J'];
  const SI_BASE = ['kg', 'm', 's', 'K', 'A', 'mol', 'cd'];
  const BASE_NAMES = I.localize([{ de: 'Masse', en: 'mass' }, { de: 'Länge', en: 'length' }, { de: 'Zeit', en: 'time' }, { de: 'Temperatur', en: 'temperature' },
    { de: 'Stromstärke', en: 'electric current' }, { de: 'Stoffmenge', en: 'amount of substance' }, { de: 'Lichtstärke', en: 'luminous intensity' }]);

  const dimless = () => BASES.map(() => Rz);
  function dimParse(str) {
    const d = dimless();
    if (!str || str.trim() === '1' || str.trim() === '') return d;
    const re = /(Θ|Th|M|L|T|I|N|J)(?:\^(-?\d+)(?:\/(\d+))?)?/g;
    let m, consumed = '';
    while ((m = re.exec(str))) {
      const key = m[1] === 'Th' ? 'Θ' : m[1];
      const i = BASES.indexOf(key);
      if (m[3] && parseInt(m[3], 10) === 0) throw new Error(T('Ungültige Dimensionsangabe: Nenner 0 im Exponenten von ', 'Invalid dimension: zero denominator in the exponent of ') + key);
      const e = R(m[2] ? parseInt(m[2], 10) : 1, m[3] ? parseInt(m[3], 10) : 1);
      d[i] = radd(d[i], e);
      consumed += m[0];
    }
    if (consumed.replace(/\s/g, '') !== str.replace(/\s/g, '')) throw new Error(T('Ungültige Dimensionsangabe: ', 'Invalid dimension: ') + str);
    return d;
  }
  const dimMul = (a, b) => a.map((x, i) => radd(x, b[i]));
  const dimDiv = (a, b) => a.map((x, i) => radd(x, rneg(b[i])));
  const dimPow = (a, p) => a.map((x) => rmul(x, p));
  const dimEq = (a, b) => a.every((x, i) => x.n === b[i].n && x.d === b[i].d);
  const dimIsless = (a) => a.every(rzero);
  const dimKey = (a) => a.map((x) => x.n + '/' + x.d).join(',');

  const SUP = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹', '-': '⁻', '/': 'ᐟ' };
  const sup = (s) => String(s).split('').map((c) => SUP[c] || c).join('');
  const rStr = (r) => (r.d === 1 ? String(r.n) : r.n + '/' + r.d);
  const rTex = (r) => (r.d === 1 ? String(r.n) : r.n + '/' + r.d);

  function dimStr(a) {
    const parts = [];
    a.forEach((e, i) => { if (!rzero(e)) parts.push(BASES[i] + (e.n === 1 && e.d === 1 ? '' : sup(rStr(e)))); });
    return parts.length ? parts.join(' ') : '1';
  }
  function dimTex(a) {
    const parts = [];
    a.forEach((e, i) => {
      if (rzero(e)) return;
      const b = BASES[i] === 'Θ' ? '\\Theta' : '\\mathsf{' + BASES[i] + '}';
      parts.push(e.n === 1 && e.d === 1 ? b : b + '^{' + rTex(e) + '}');
    });
    return parts.length ? parts.join('\\,') : '1';
  }
  function siUnitStr(a) {
    const pos = [], neg = [];
    a.forEach((e, i) => {
      if (rzero(e)) return;
      const s = SI_BASE[i] + (e.n === 1 && e.d === 1 ? '' : sup(rStr(e)));
      (rval(e) > 0 ? pos : neg).push(s);
    });
    const all = pos.concat(neg);
    return all.length ? all.join(' ') : '1';
  }

  // Named derived units and quantity names (lookup by dimension)
  const NAMED = I.localize([
    ['M L T^-2', 'N', 'Kraft', 'force'],
    ['M L^2 T^-2', 'J', 'Energie', 'energy'],
    ['M L^2 T^-3', 'W', 'Leistung', 'power'],
    ['M L^-1 T^-2', 'Pa = J/m³', 'Druck / Energiedichte', 'pressure / energy density'],

  /* ---------- Numeric evaluation: sign + log10 + double ---------- */

  /* ---------- Dimensional analysis ---------- */
  function dimAnalyze(ast, symDims) {

  function checkEquation(eq, symDims) {

    if (eq.lhs) {
      const L_ = dimAnalyze(eq.lhs, symDims);
      result.lhs = L_;
      result.consistent = R_.ok && L_.ok;
      if (!dimEq(L_.dim, R_.dim)) {
        result.consistent = false;
        result.mismatch = { left: L_.dim, right: R_.dim, ratio: dimDiv(R_.dim, L_.dim) };

  /* ---------- Factor flattening (for step-by-step derivations) ---------- */

    }

    const german = /[„äöüÄÖÜß]/, names = /Schrödinger|Eötvös|Göttingen/g;
    const skip = new Set(['ast', 'lhs', 'rhs', 'symDims', 'dimv', 'values', 'checks']);
    const bad = [], seen = new WeakSet();
    const walk = (o, path) => {
      if (!o || typeof o !== 'object' || seen.has(o)) return;
      seen.add(o);
      for (const k of Object.keys(o)) {
        if (skip.has(k)) continue;
        const v = o[k];
        if (typeof v === 'string') { if (german.test(v.replace(names, ''))) bad.push(path + '.' + k + ': ' + v.slice(0, 60)); }
        else walk(v, path + '.' + k);
      }
    };
    I.with('en', () => { M.registry.forEach((e) => walk(e, e.id)); walk(M.C, 'C'); walk(M.KIND_LABEL, 'KIND_LABEL'); });

  function runAll() {

    return T.map((t, i) => ({ group: t.group, name: t.name, pass: errs[i] === null, err: errs[i] || undefined }));
  }
  PP.tests = { list: T, runAll };

  function label(ctx, s, x, y, col, opts = {}) {
    ctx.font = (opts.size || 12) + 'px ' + (opts.mono ? col.mono : col.sans);
    ctx.fillStyle = opts.color || col.ink2;
    ctx.textAlign = opts.align || 'left';
    ctx.textBaseline = opts.base || 'alphabetic';

  }
  function grid(ctx, W, H, col, step = 24) {
    ctx.strokeStyle = col.grid; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = step; x < W; x += step) { ctx.moveTo(Math.round(x) + 0.5, 0); ctx.lineTo(Math.round(x) + 0.5, H); }
    for (let y = step; y < H; y += step) { ctx.moveTo(0, Math.round(y) + 0.5); ctx.lineTo(W, Math.round(y) + 0.5); }

  }
  function note(ctx, s, W, H, col) { label(ctx, s, W - 10, H - 10, col, { align: 'right', size: 11, color: col.ink3 }); }
  function invalid(ctx, W, H, col, msg) {

  function rng(seed) { let s = seed; return () => ((s = (s * 16807) % 2147483647) / 2147483647); }

  const V = {};

  V.gravity = (ctx, W, H, S) => {
    const { v, o, col } = S;
    grid(ctx, W, H, col);
    const F = o('F');
    const cy = H * 0.46;
    const rad = (m) => (m > 0 ? map(Math.log10(m), -3, 42, 7, Math.min(46, H * 0.17)) : 8);
    const r1 = rad(v.m1), r2 = rad(v.m2);
    const sep = v.r > 0 ? map(Math.log10(v.r), -6, 14, W * 0.2, W * 0.64) : 0;
    const gap = Math.max(sep, r1 + r2 + 24);
    const x1 = W / 2 - gap / 2, x2 = W / 2 + gap / 2;
    [[x1, r1, v.m1, 'm₁'], [x2, r2, v.m2, 'm₂']].forEach(([x, r, m, name]) => {
      const g = ctx.createRadialGradient(x - r * 0.35, cy - r * 0.35, r * 0.1, x, cy, r);
      g.addColorStop(0, col.ink); g.addColorStop(1, col.ink3);
      ctx.fillStyle = m > 0 ? g : 'transparent';
      ctx.beginPath(); ctx.arc(x, cy, r, 0, Math.PI * 2); ctx.fill();
      if (!(m > 0)) { ctx.setLineDash([3, 3]); ctx.strokeStyle = col.red; ctx.stroke(); ctx.setLineDash([]); }
      label(ctx, name + ' = ' + f3(m) + ' kg', x, cy + Math.max(r1, r2) + 22, col, { align: 'center', mono: true, size: 12, color: col.ink });
    });
    // distance bracket
    const by = cy + Math.max(r1, r2) + 44;
    ctx.strokeStyle = col.ink3; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x1, by - 5); ctx.lineTo(x1, by + 5); ctx.moveTo(x2, by - 5); ctx.lineTo(x2, by + 5); ctx.moveTo(x1, by); ctx.lineTo(x2, by); ctx.stroke();
    label(ctx, 'r = ' + f3(v.r) + ' m', (x1 + x2) / 2, by + 18, col, { align: 'center', mono: true, color: col.ink });
    // force arrows
    if (isFinite(F) && F !== 0) {
      const len = map(Math.log10(Math.abs(F)), -40, 60, 12, Math.min(W * 0.2, gap / 2 - 6));
      const dir = F > 0 ? 1 : -1; // negative G → repulsion
      const c = F > 0 ? col.accent : col.red;
      if (dir > 0) {
        arrow(ctx, x1 + r1 + 4, cy, x1 + r1 + 4 + len, cy, c, 2.5, 10);
        arrow(ctx, x2 - r2 - 4, cy, x2 - r2 - 4 - len, cy, c, 2.5, 10);
      } else {
        arrow(ctx, x1 - r1 - 4, cy, x1 - r1 - 4 - len, cy, c, 2.5, 10);
        arrow(ctx, x2 + r2 + 4, cy, x2 + r2 + 4 + len, cy, c, 2.5, 10);
      }
      label(ctx, 'F = ' + (S.fo ? S.fo('F', true) : f3(Math.abs(F))) + ' N' + (dir < 0 ? tr('  (abstoßend)', '  (repulsive)') : ''), W / 2, cy - Math.max(r1, r2) - 18, col, { align: 'center', mono: true, color: c, size: 13 });
    } else if (!isFinite(F)) {

  };

  V.kinematics = (ctx, W, H, S) => {
    const { v, o, col } = S;
    grid(ctx, W, H, col);
    const tmax = Math.max(v.t, 1) * 1.15;
    const sAt = (t) => v.s0 + v.v0 * t + 0.5 * v.a * t * t;
    let lo = Infinity, hi = -Infinity;
    for (let i = 0; i <= 60; i++) { const s = sAt((tmax * i) / 60); lo = Math.min(lo, s); hi = Math.max(hi, s); }
    if (!isFinite(lo) || !isFinite(hi)) return invalid(ctx, W, H, col, tr('Werte nicht darstellbar', 'Values cannot be displayed'));
    if (hi - lo < 1e-9) { lo -= 1; hi += 1; }
    const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;
    const X = (s) => map(s, lo, hi, 40, W - 40);
    const ty = H * 0.55;
    ctx.strokeStyle = col.ink3; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(30, ty); ctx.lineTo(W - 30, ty); ctx.stroke();
    // ticks
    const step = Math.pow(10, Math.floor(Math.log10((hi - lo) / 5)));
    const st = (hi - lo) / step > 10 ? step * 2 : step;
    ctx.lineWidth = 1;
    for (let s = Math.ceil(lo / st) * st; s <= hi; s += st) {
      ctx.beginPath(); ctx.moveTo(X(s), ty); ctx.lineTo(X(s), ty + 6); ctx.stroke();
      label(ctx, E.fmt(s, 3), X(s), ty + 20, col, { align: 'center', size: 10, mono: true, color: col.ink3 });
    }
    label(ctx, 's in m', W - 30, ty + 36, col, { align: 'right', size: 11, color: col.ink3 });
    // trail: one mark per second

    for (let i = 0; i <= n; i++) {

      ctx.beginPath(); ctx.arc(X(sAt(i)), ty, 3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // start marker
    ctx.strokeStyle = col.ink3; ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(X(v.s0), ty - 40); ctx.lineTo(X(v.s0), ty); ctx.stroke(); ctx.setLineDash([]);
    label(ctx, 's₀', X(v.s0), ty - 44, col, { align: 'center', size: 11 });

    ctx.fillStyle = col.ink;
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(bx - 16, ty - 22, 32, 18, 4) : ctx.rect(bx - 16, ty - 22, 32, 18); ctx.fill();
    ctx.fillStyle = col.bg; ctx.beginPath(); ctx.arc(bx - 8, ty - 3, 4, 0, 7); ctx.arc(bx + 8, ty - 3, 4, 0, 7); ctx.fill();
    const vmax = Math.max(Math.abs(v.v0), Math.abs(v.v0 + v.a * tmax), 1e-9);
    const vl = (vel / vmax) * W * 0.18;
    arrow(ctx, bx, ty - 34, bx + vl, ty - 34, col.cyan, 2.5);
    if (v.a !== 0) arrow(ctx, bx, ty - 48, bx + Math.sign(v.a) * 26, ty - 48, col.accent, 2, 7);
    label(ctx, 'v', bx + vl + (vl >= 0 ? 6 : -14), ty - 30, col, { color: col.cyan });
    label(ctx, 't = ' + E.fmt(v.t, 3) + ' s    s = ' + f3(s) + ' m    v = ' + f3(vel) + ' m/s', 16, 24, col, { mono: true, color: col.ink });
    label(ctx, tr('Punkte: Position zu jeder vollen Sekunde', 'Dots: position at every full second'), 16, 42, col, { size: 11, color: col.ink3 });
  };

  V.freefall = (ctx, W, H, S) => {
    const { v, o, col } = S;
    grid(ctx, W, H, col);
    const ground = H - 34, top = 28;
    const hmax = Math.max(v.h0, 1e-9);
    const Y = (h) => ground - (clamp(h, 0, hmax) / hmax) * (ground - top);
    ctx.fillStyle = col.panel2; ctx.fillRect(0, ground, W, H - ground);
    ctx.strokeStyle = col.ink3; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, ground); ctx.lineTo(W, ground); ctx.stroke();
    // ruler
    const rx = 56;
    ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(rx, top); ctx.lineTo(rx, ground); ctx.stroke();
    for (let i = 0; i <= 5; i++) {

      label(ctx, E.fmt(h, 3) + ' m', rx - 10, Y(h) + 4, col, { align: 'right', size: 10, mono: true, color: col.ink3 });

        ctx.fillStyle = col.cyan; ctx.globalAlpha = 0.25;
        ctx.beginPath(); ctx.arc(bx, Y(v.h0 - 0.5 * v.g * t * t), 6, 0, 7); ctx.fill();
      }

    }

    label(ctx, 'v = ' + f3(landed ? vi : vel) + ' m/s', W - 16, 66, col, { align: 'right', mono: true, color: col.cyan });

  };

  V.spring = (ctx, W, H, S) => {
    const { v, o, col, t } = S;
    grid(ctx, W, H, col);
    const T = o('T');
    const wx = 28, cy = H * 0.5;
    ctx.fillStyle = col.panel2; ctx.fillRect(0, cy - 60, wx, 120);
    ctx.strokeStyle = col.ink3; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(wx, cy - 60); ctx.lineTo(wx, cy + 60); ctx.stroke();
    const eq = W * 0.55;
    const scale = (W * 0.3) / Math.max(0.5, Math.abs(v.x));
    if (!isFinite(T) || T <= 0) {
      invalid(ctx, W, H * 0.3, col, tr('Keine Schwingung: k und m müssen positiv sein', 'No oscillation: k and m must be positive'));
    }
    const Tdisp = isFinite(T) && T > 0 ? clamp(T, 1.2, 6) : Infinity;
    const phase = isFinite(Tdisp) ? (2 * Math.PI * t) / Tdisp : 0;
    const x = v.x * Math.cos(phase);
    const mx = eq + x * scale;
    // spring zigzag
    const coils = 14, x0 = wx, x1 = mx - 26;
    ctx.strokeStyle = col.ink2; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(x0, cy);
    for (let i = 1; i < coils * 2; i++) {
      const px = lerp(x0 + 8, x1 - 8, i / (coils * 2));
      ctx.lineTo(px, cy + (i % 2 ? -12 : 12));
    }
    ctx.lineTo(x1, cy); ctx.stroke();
    ctx.setLineDash([3, 4]); ctx.strokeStyle = col.ink3; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(eq, cy - 60); ctx.lineTo(eq, cy + 60); ctx.stroke(); ctx.setLineDash([]);
    label(ctx, 'x = 0', eq, cy + 76, col, { align: 'center', size: 11 });
    ctx.fillStyle = col.ink; ctx.fillRect(mx - 26, cy - 22, 52, 44);
    label(ctx, f3(v.m) + ' kg', mx, cy + 4, col, { align: 'center', mono: true, size: 11, color: col.bg });
    const Fnow = -v.k * x, Fmax = Math.abs(v.k * v.x) || 1;
    arrow(ctx, mx, cy - 34, mx + (Fnow / Fmax) * W * 0.16, cy - 34, col.accent, 2.5);
    label(ctx, 'F = −kx', mx, cy - 44, col, { align: 'center', color: col.accent, size: 11 });
    if (isFinite(T) && T > 0) {

      const txt = Math.abs(f - 1) < 1e-6 ? tr('Echtzeit', 'real time') : f < 1 ? tr('Zeitlupe: ' + E.fmt(1 / f, 3) + '× langsamer', 'slow motion: ' + E.fmt(1 / f, 3) + '× slower') : tr('Zeitraffer: ' + E.fmt(f, 3) + '× schneller', 'time-lapse: ' + E.fmt(f, 3) + '× faster');

    }
  };

  V.circular = (ctx, W, H, S) => {
    const { o, col, t } = S;
    grid(ctx, W, H, col);
    const T = o('T');
    const cx = W / 2, cy = H / 2, R = Math.min(W, H) * 0.34;
    ctx.strokeStyle = col.ink3; ctx.setLineDash([4, 5]); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = col.ink3; ctx.beginPath(); ctx.arc(cx, cy, 3, 0, 7); ctx.fill();
    if (!isFinite(T) || T <= 0) return invalid(ctx, W, H, col, tr('Keine Umlaufbewegung darstellbar', 'No orbital motion to display'));
    const Tdisp = clamp(T, 2.5, 8);
    const ang = -(2 * Math.PI * t) / Tdisp;
    const px = cx + R * Math.cos(ang), py = cy + R * Math.sin(ang);

    arrow(ctx, px, py, px + (cx - px) * 0.45, py + (cy - py) * 0.45, col.accent, 2.5);
    ctx.fillStyle = col.ink; ctx.beginPath(); ctx.arc(px, py, 9, 0, 7); ctx.fill();
    label(ctx, 'v', px + tx * R * 0.55 + 6, py + ty * R * 0.55, col, { color: col.cyan });
    label(ctx, tr('a (zur Mitte)', 'a (towards the centre)'), 16, 44, col, { color: col.accent, size: 12 });
    label(ctx, 'v (tangential)', 16, 62, col, { color: col.cyan, size: 12 });
    const f = T / Tdisp;
    label(ctx, 'T = ' + f3(T) + ' s' + (Math.abs(f - 1) < 1e-6 ? '' : tr('   (Anzeige ', '   (shown ') + E.fmt(f > 1 ? f : 1 / f, 3) + '× ' + (f > 1 ? tr('schneller', 'faster') : tr('langsamer', 'slower')) + ')'), 16, 24, col, { mono: true, color: col.ink });
  };

  V.relativity = (ctx, W, H, S) => {
    const { v, o, col, t } = S;
    grid(ctx, W, H, col);
    const g = o('gamma');
    if (!isFinite(g)) return invalid(ctx, W, H, col, tr('γ ist für |β| ≥ 1 nicht definiert', 'γ is not defined for |β| ≥ 1'));

    const rowY = [H * 0.16, H * 0.34];
    label(ctx, tr('Stab in Ruhe: L₀', 'Rod at rest: L₀'), 16, rowY[0] + 5, col, { size: 12 });
    ctx.fillStyle = col.ink2; ctx.fillRect(x0, rowY[0] - 7, L, 14);
    label(ctx, tr('gemessen im Labor: L = L₀/γ', 'measured in the lab: L = L₀/γ'), 16, rowY[1] + 5, col, { size: 12 });

    ctx.fillStyle = col.accent; ctx.fillRect(x0 + drift, rowY[1] - 7, Math.max(Lc, 1.5), 14);

    });

    note(ctx, tr('Gemessene, nicht gesehene Längen (Terrell-Penrose)', 'Measured, not seen, lengths (Terrell–Penrose)'), W, H - 14, col);
  };

  const STARS = (() => { const r = rng(7); return Array.from({ length: 90 }, () => [r(), r(), r()]); })();
  function stars(ctx, W, H, col) {
    ctx.fillStyle = col.ink3;
    for (const [x, y, s] of STARS) { ctx.globalAlpha = 0.3 + s * 0.5; ctx.fillRect(x * W, y * H, s > 0.8 ? 2 : 1, s > 0.8 ? 2 : 1); }
    ctx.globalAlpha = 1;
  }

  V.blackhole = (ctx, W, H, S) => {
    const { v, o, col, t } = S;
    stars(ctx, W, H, col);
    const T = o('TH');
    if (!isFinite(T)) return invalid(ctx, W, H, col, tr('T_H ist für M ≤ 0 nicht definiert', 'T_H is not defined for M ≤ 0'));
    const cx = W / 2, cy = H * 0.46;
    const R = map(Math.log10(Math.max(v.M, 1)), 8, 42, 14, Math.min(W, H) * 0.26);
    const lt = Math.log10(T);

    const r = rng(3);
    for (let i = 0; i < n; i++) {
      const a = r() * Math.PI * 2, sp = 0.4 + r() * 0.6, off = r();

    glow.addColorStop(0, hot > 0.5 ? col.accent : col.cyan); glow.addColorStop(1, 'transparent');
    ctx.globalAlpha = 0.15 + hot * 0.5; ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(cx, cy, R * 1.6, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.fill();
    ctx.strokeStyle = col.ink3; ctx.lineWidth = 1; ctx.stroke();
    label(ctx, 'T_H = ' + f3(T) + ' K', cx, cy + R + 30, col, { align: 'center', mono: true, size: 14, color: col.ink });
    const cmb = PP.model.C.T_cmb.value;
    label(ctx, T < cmb ? tr('kälter als die Hintergrundstrahlung (2,7 K)', 'colder than the cosmic microwave background (2.7 K)') : tr('heißer als die Hintergrundstrahlung (2,7 K)', 'hotter than the cosmic microwave background (2.7 K)'), cx, cy + R + 50, col, { align: 'center', size: 12, color: T < cmb ? col.cyan : col.accent });
    label(ctx, 'r_s = ' + f3(o('rs')) + ' m', 16, 24, col, { mono: true, color: col.ink2 });
    note(ctx, tr('Schematisch: Größe ~ log M, Teilchenzahl ~ log T', 'Schematic: size ~ log M, number of particles ~ log T'), W, H, col);
  };

  V.horizon = (ctx, W, H, S) => {
    const { o, col, t } = S;
    stars(ctx, W, H, col);
    const skb = o('SkB');
    const cx = W / 2, cy = H * 0.45, R = Math.min(W, H) * 0.3;
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.fill();
    ctx.strokeStyle = col.accent; ctx.lineWidth = 0.8; ctx.globalAlpha = 0.55;
    const rot = t * 0.15;
    for (let i = -5; i <= 5; i++) {
      const y = (i / 6) * R, rr = Math.sqrt(R * R - y * y);
      ctx.beginPath(); ctx.ellipse(cx, cy + y, rr, rr * 0.18, 0, 0, 7); ctx.stroke();
    }
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI + (rot % (Math.PI / 12));
      ctx.beginPath(); ctx.ellipse(cx, cy, Math.abs(Math.cos(a)) * R, R, 0, 0, 7); ctx.stroke();
    }
    ctx.globalAlpha = 1;

      p.innerHTML = '<label for="savename">' + T('Name für diesen Zustand', 'Name for this state') + '</label><input id="savename" value="' + esc(S.exp.title + (S.cmp ? ' (A/B)' : '')) + '"><div class="row"><button class="btn on" data-a="dosave">' + T('Speichern', 'Save') + '</button><button class="btn" data-a="closepop">' + T('Abbrechen', 'Cancel') + '</button></div><div class="faint" style="font-size:12px">' + T('Wird lokal in diesem Browser gespeichert.', 'Stored locally in this browser.') + '</div>';
    } else {
      let href = '';
      try { href = location.href.split('#')[0] + '#' + st; } catch (_) { href = '#' + st; }
      p.innerHTML = '<label for="sharelink">' + T('Link auf genau diesen Zustand', 'Link to exactly this state') + '</label><div class="row"><input id="sharelink" readonly value="' + esc(href) + '"><button class="btn sm" data-a="copylink">' + T('Kopieren', 'Copy') + '</button></div>' +
        '<label for="sharecode">' + T('Zustands-Code (zum Einfügen unter „Gespeichert“)', 'State code (to paste under “Saved”)') + '</label><div class="row"><input id="sharecode" readonly value="' + esc(st) + '"><button class="btn sm" data-a="copycode">' + T('Kopieren', 'Copy') + '</button></div>' +
        '<div class="faint" style="font-size:12px">' + T('Wenn die App in einer Vorschau läuft, funktioniert der Code zuverlässiger als der Link.', 'If the app is running inside a preview, the code works more reliably than the link.') + '</div>';
    }
    p.hidden = false;
    const f = p.querySelector('input'); if (f) { f.focus(); f.select(); }
    if (kind === 'save') f.addEventListener('keydown', (e) => { if (e.key === 'Enter') p.querySelector('[data-a="dosave"]').click(); });
  }
  function closePop() { const p = $('#pop'); if (p) p.hidden = true; }

  /* ---------- lab mount ---------- */
  let raf = 0, lastTs = 0, ro = null;
  S.plots = [];

  function mountLab() {
    unmountLab(true);
    const lab = $('#lab');
    if (!lab) return;
    recompute();
    renderParams();
    renderGraphPanel();
    update();
    lab.addEventListener('input', onLabInput);
    lab.addEventListener('change', onLabChange);
    lab.addEventListener('click', onLabClick);
    lab.addEventListener('focusout', onLabBlur);
    lab.addEventListener('keydown', onLabKey);
    if (typeof ResizeObserver === 'function') {
      ro = new ResizeObserver(() => { drawViz(); S.plots.forEach((p) => p.draw()); });
      $$('canvas', lab).forEach((c) => ro.observe(c));
    }
    lastTs = 0;
    if (typeof requestAnimationFrame === 'function') raf = requestAnimationFrame(tick);
  }
  function unmountLab(keepListeners) {
    if (raf && typeof cancelAnimationFrame === 'function') cancelAnimationFrame(raf);
    raf = 0;
    if (ro) { ro.disconnect(); ro = null; }
    S.plots = [];
    S.playing = false;
    void keepListeners;
  }

  function tick(ts) {
    raf = requestAnimationFrame(tick);
    const dt = lastTs ? Math.min(0.1, (ts - lastTs) / 1000) : 0;
    lastTs = ts;
    if (!$('#vizc')) return;
    if (document.hidden) return;
    if (S.playing) {
      const exp = S.exp, k = exp.animateVar, d = exp.vars[k];
      let lim = d.max;
      if (exp.animateUntil) {
        const r = S.res.A && S.res[S.edit].out[exp.animateUntil];
        if (r && r.ok && r.value > 0 && isFinite(r.value)) lim = Math.min(lim, r.value);
      }
      let x = S.vals[S.edit][k] + dt;
      if (x >= lim) { x = lim; S.playing = false; }
      S.vals[S.edit][k] = x;
      update();
      if (!S.playing) renderParams();
      return;
    }
    if (!S.paused && ANIM.has(S.exp.viz)) { S.clock += dt; drawViz(); }
  }

  /* ---------- parameters ---------- */
  function prmHTML(d, x) {
    const locked = d.constant && !S.brk;
    const off = outOfRange(d, x) && !(d.constant && x === M.C[d.constant].value);
    const di = U.unit(d.dimv);
    let extra = '';
    if (d.constant) {
      const c = M.C[d.constant];
      extra += '<span>' + T('Naturkonstante · ', 'Constant of nature · ') + esc(M.KIND_LABEL[c.kind]) + '</span>';
      if (S.brk) extra += ' <button class="btn sm" data-op="div" data-k="' + d.key + '">÷10</button><button class="btn sm" data-op="mul" data-k="' + d.key + '">×10</button><button class="btn sm" data-op="orig" data-k="' + d.key + '">' + T('Originalwert', 'Original value') + '</button>';
      else extra += ' <span class="faint">' + T('· im Break-Modus veränderbar', '· adjustable in Break mode') + '</span>';
    } else if (S.brk) {
      extra += '<button class="btn sm" data-op="neg" data-k="' + d.key + '" title="' + T('Vorzeichen umkehren', 'Flip sign') + '">±</button><button class="btn sm" data-op="div" data-k="' + d.key + '">÷10</button><button class="btn sm" data-op="mul" data-k="' + d.key + '">×10</button>';
    }
    if (S.exp.animateVar === d.key) {
      extra += '<button class="btn sm' + (S.playing ? ' on' : '') + '" data-op="play" data-k="' + d.key + '">' + (S.playing ? T('Anhalten', 'Pause') : T('Zeit laufen lassen', 'Let time run')) + '</button>';
    }
    if (off && !locked) extra += '<span style="color:var(--red)">' + T('außerhalb des Slider-Bereichs', 'outside the slider range') + '</span>';
    return '<div class="prm' + (locked ? ' locked' : '') + (off ? ' off' : '') + '" data-k="' + d.key + '">' +
      '<div class="lab2">' + U.tex(d.tex) + '<span class="nm" title="' + esc(d.name) + '">' + esc(d.name) + '</span></div>' +
      '<div class="valbox"><input class="num" data-k="' + d.key + '" value="' + esc(U.fmtInput(x)) + '" inputmode="decimal" spellcheck="false" aria-label="' + esc(d.name) + ' in ' + esc(di || T('Einheit 1', 'unit 1')) + '"' + (locked ? ' readonly' : '') + '><span class="unit">' + esc(di) + '</span></div>' +
      '<div class="sl"><input type="range" min="0" max="1000" step="1" data-k="' + d.key + '" aria-label="' + esc(d.name) + T(' Schieberegler', ' slider') + '"' + (locked ? ' disabled' : '') + '><span class="scl">' + SCL[d.scale] + '</span></div>' +
      (extra ? '<div class="extra">' + extra + '</div>' : '') +
      '</div>';
  }
  function usedConstants() {
    const f = form();
    const set = new Set();
    const varKeys = new Set(f.c.vars.map((v) => v.key));
    f.c.outputs.forEach((o) => E.symbolsIn(o.ast).forEach((s) => { if (M.C[s] && !varKeys.has(s) && M.C[s].kind !== 'math') set.add(s); }));
    return [...set];
  }
  function renderParams() {
    const box = $('#prms');
    if (!box) return;
    const f = form();
    const vals = S.vals[S.edit];
    box.innerHTML = f.c.vars.length
      ? f.c.vars.map((d) => prmHTML(d, vals[d.key])).join('')
      : '<p class="muted" style="margin:0;font-size:13px">' + T('Keine freien Parameter: Hier rechnen nur Naturkonstanten.', 'No free parameters: only constants of nature go into this calculation.') + (S.brk ? T(' Unten kannst du sie verstellen.', ' You can adjust them below.') : T(' Im Break-Modus kannst du sie verstellen.', ' You can adjust them in Break mode.')) + '</p>';
    const cb = $('#cprms');
    if (S.brk) {
      const cs = usedConstants();
      const cv = S.consts[S.edit];
      cb.innerHTML = cs.length ? '<div class="side-lbl" style="margin-top:14px">' + T('Naturkonstanten in diesen Formeln', 'Constants of nature in these formulas') + '</div>' + cs.map((k) => {
        const c = M.C[k];
        const x = k in cv ? cv[k] : c.value;
        const changed = k in cv && Math.abs(x / c.value - 1) > 1e-12;
        return '<div class="prm' + (changed ? ' off' : '') + '" data-c="' + k + '"><div class="lab2">' + U.tex(c.tex) + '<span class="nm">' + esc(c.name) + '</span></div>' +
          '<div class="valbox"><input class="num" data-c="' + k + '" value="' + esc(U.fmtInput(x)) + '" inputmode="decimal" aria-label="' + esc(c.name) + '"><span class="unit">' + esc(U.unit(c.dimv)) + '</span></div>' +
          '<div class="extra"><button class="btn sm" data-cop="div" data-c="' + k + '">÷10</button><button class="btn sm" data-cop="mul" data-c="' + k + '">×10</button><button class="btn sm" data-cop="orig" data-c="' + k + '">' + T('Originalwert', 'Original value') + '</button>' + (changed ? '<span style="color:var(--red)">' + T('verändert: ×', 'changed: ×') + esc(E.fmt(x / c.value, 3)) + '</span>' : '') + '</div></div>';
      }).join('') : '';
    } else cb.innerHTML = '';
    syncInputs();
  }
  function syncInputs() {
    const vals = S.vals[S.edit];
    $$('#prms input[type=range]').forEach((r) => {
      const d = S.exp.vars[r.dataset.k];
      const p = toPos(d, vals[d.key]) * 1000;
      r.value = String(Math.round(p));
      r.style.setProperty('--p', (p / 10) + '%');
    });
    $$('#prms input.num').forEach((i) => {
      if (i === document.activeElement) return;
      i.value = U.fmtInput(vals[i.dataset.k]);
      i.classList.remove('bad');
    });
  }
  function setVal(k, x, fromSlider) {
    const d = S.exp.vars[k];
    const vals = S.vals[S.edit];
    if (!S.brk && !fromSlider) {
      if (d.constant) return false;
      if (d.integer) x = Math.round(x);
      const clamped = Math.min(d.max, Math.max(d.min, x));
      if (clamped !== x) U.toast(d.label + T(': regulärer Bereich ', ': regular range ') + E.fmt(d.min, 3) + ' … ' + E.fmt(d.max, 3) + T(' – im Break-Modus frei', ' – unrestricted in Break mode'));
      x = clamped;
    }
    const wasOff = outOfRange(d, vals[k]);
    vals[k] = x;
    if (S.preset !== null) { S.preset = null; const n = $('#pnote'); if (n) n.textContent = ''; $$('.presets .chip').forEach((c) => c.classList.remove('on')); }
    if (wasOff !== outOfRange(d, x) && S.brk) { renderParams(); }
    if (fromSlider) scheduleUpdate(); else update();
    return true;
  }
  let pending = false;
  function scheduleUpdate() {
    if (typeof requestAnimationFrame !== 'function') return update();
    if (pending) return;
    pending = true;
    requestAnimationFrame(() => { pending = false; update(); });
  }
  function onLabInput(e) {
    const t = e.target;
    if (t.type === 'range' && t.dataset.k) {
      const d = S.exp.vars[t.dataset.k];
      setVal(d.key, fromPos(d, Number(t.value) / 1000), true);
    }
  }
  function commitNum(t) {
    const x = U.parseNum(t.value);
    if (x === null) { t.classList.add('bad'); t.title = T('Nicht lesbar. Beispiele: 6.674e-11 · 1,5 · 3×10^8 · 2*M_sun', 'Not readable. Examples: 6.674e-11 · 1.5 · 3×10^8 · 2*M_sun'); return; }
    t.classList.remove('bad'); t.title = '';
    if (t.dataset.c) { S.consts[S.edit][t.dataset.c] = x; renderParams(); update(); return; }
    const d = S.exp.vars[t.dataset.k];
    if (!S.brk && d.positive && !(x > 0)) { t.classList.add('bad'); U.toast(d.label + T(' muss positiv sein – im Break-Modus erlaubt', ' must be positive – allowed in Break mode')); return; }
    setVal(t.dataset.k, x, false);
    t.value = U.fmtInput(S.vals[S.edit][t.dataset.k]);
  }
  function onLabChange(e) {
    const t = e.target;
    if (t.classList.contains('num')) commitNum(t);
    else if (t.dataset.vo) { S.vizOpts[t.dataset.vo] = t.checked; drawViz(); }
    else if (t.dataset.g) onGraphSelect(t);
  }
  function onLabKey(e) {
    if (e.key === 'Enter' && e.target.classList.contains('num')) { e.preventDefault(); commitNum(e.target); }
  }
  function onLabBlur(e) {
    const t = e.target;
    if (t.classList && t.classList.contains('num') && !t.classList.contains('bad')) {
      const v = t.dataset.c ? (S.consts[S.edit][t.dataset.c] ?? M.C[t.dataset.c].value) : S.vals[S.edit][t.dataset.k];
      t.value = U.fmtInput(v);
    }
  }
  function onLabClick(e) {
    const b = e.target.closest('button');
    if (!b) return;
    const vals = S.vals[S.edit];
    if (b.dataset.preset !== undefined) {
      const p = S.exp.presets[Number(b.dataset.preset)];
      Object.assign(vals, p.values);
      S.consts[S.edit] = {};
      S.base = { vals: Object.assign({}, vals), consts: {}, form: S.form };
      S.preset = p;
      S.playing = false;
      $$('.presets .chip').forEach((c) => c.classList.toggle('on', c === b));
      const n = $('#pnote'); if (n) n.textContent = p.note ? p.note : '';
      renderParams(); update();
    } else if (b.dataset.op) {
      const k = b.dataset.k, d = S.exp.vars[k];
      if (b.dataset.op === 'play') {
        if (S.playing) S.playing = false;
        else {
          let lim = d.max;
          const r = S.exp.animateUntil && S.res[S.edit].out[S.exp.animateUntil];
          if (r && r.ok && r.value > 0) lim = Math.min(lim, r.value);
          if (vals[k] >= lim - 1e-9 || vals[k] < d.min) vals[k] = d.min;
          S.playing = true;
        }
        renderParams(); return;
      }
      let x = vals[k];
      if (b.dataset.op === 'mul') x *= 10;
      else if (b.dataset.op === 'div') x /= 10;
      else if (b.dataset.op === 'neg') x = -x;
      else if (b.dataset.op === 'orig') x = M.C[d.constant].value;
      vals[k] = x;
      renderParams(); update();
    } else if (b.dataset.cop) {
      const k = b.dataset.c, c = M.C[k], cv = S.consts[S.edit];
      const x = k in cv ? cv[k] : c.value;
      if (b.dataset.cop === 'orig') delete cv[k];
      else cv[k] = b.dataset.cop === 'mul' ? x * 10 : x / 10;
      renderParams(); update();
    } else if (b.dataset.form) {
      S.form = b.dataset.form;
      S.graph = U.defaultGraph(S.exp, S.form);
      S.base = { vals: Object.assign({}, S.vals.A), consts: Object.assign({}, S.consts.A), form: S.form };
      S.preset = null;
      U.render(false);
    } else if (b.dataset.edit) {
      S.edit = b.dataset.edit;
      S.playing = false;
      $$('[data-edit]').forEach((x) => x.classList.toggle('on', x === b));
      const h = $('#lab .ph h3'); if (h) h.textContent = T('Visualisierung · Satz ', 'Visualisation · Set ') + S.edit;
      renderParams(); update();
    } else if (b.dataset.gx) {
      S.graph.xlog = b.dataset.gx === 'log'; renderGraphPanel(); updatePlots(); U.writeHash();
    } else if (b.dataset.gy) {
      S.graph.ylog = b.dataset.gy === 'log'; renderGraphPanel(); updatePlots(); U.writeHash();
    } else if (b.dataset.gz) {
      const z = b.dataset.gz;
      S.plots.forEach((p, i) => { if (z === 'reset') p.reset(i > 0); else if (i === 0) p.zoom(z === 'in' ? 0.7 : 1.4); });
    } else if (b.dataset.gextra) {
      const k = b.dataset.gextra, ex = S.graph.extra;
      const i = ex.indexOf(k);
      if (i >= 0) ex.splice(i, 1); else ex.push(k);
      renderGraphPanel(); updatePlots(); U.writeHash();
    }
  }

  /* ---------- results + status ---------- */
  function renderResults() {
    const box = $('#res');
    if (!box) return;
    const f = form();
    const outs = f.c.outputs;
    const prim = outs.find((o) => o.primary) || outs[0];
    const A = S.res.A;
    let h = '';
    if (!S.cmp) {
      const r = A.out[prim.key];
      const dg = digitsFor(prim, 'A');
      const v = fmtR(r, dg.d);
      const di = E.dimInfo(prim.dimv);
      h += '<div class="rp"><div class="line">' + U.tex(prim.tex) + '<span class="mo">=</span>' +
        (v === null ? '<span class="v" style="color:var(--red)">' + T('nicht definiert', 'not defined') + '</span>' : '<span class="v">' + esc(v) + '</span><span class="u">' + esc(U.unit(prim.dimv)) + '</span>') + '</div>';
      const alt = altR(prim, r);
      const meta = [];
      if (alt) meta.push('= ' + alt);
      if (di.name) meta.push(di.name);
      if (U.unit(prim.dimv) && di.si !== U.unit(prim.dimv)) meta.push('SI: ' + di.si);
      if (dg.u && dg.u.rel > 0) meta.push(T('rel. Unsicherheit ≈ ', 'rel. uncertainty ≈ ') + E.fmt(dg.u.rel, 2) + T(' (aus ', ' (from ') + dg.u.parts.map((p) => p.key).join(', ') + ')');
      else if (dg.u && !Object.keys(S.consts.A).length) meta.push(T('keine Unsicherheit aus Konstanten', 'no uncertainty from constants'));
      h += '<div class="meta">' + esc(meta.join(' · ')) + '</div>';
      if (S.baseRes && r && r.ok) {
        const q = ratio(S.baseRes.out[prim.key], r);
        h += '<div class="delta">' + T('gegenüber ' + (S.preset ? 'Preset' : 'Ausgangswert'), 'compared with the ' + (S.preset ? 'preset' : 'starting value')) + ': ' + esc(q.t) + (q.p ? '  (' + esc(q.p) + ')' : '') + '</div>';
      }
      h += '</div>';
      h += '<table class="t rlist"><tbody>' + outs.filter((o) => o !== prim).map((o) => {
        const rr = A.out[o.key];
        const vv = fmtR(rr, digitsFor(o, 'A').d);
        const alt2 = altR(o, rr);
        return '<tr><td class="k">' + U.tex(o.tex) + '</td><td class="nm">' + esc(o.name) + (o.note ? '<br><span class="faint">' + esc(o.note) + '</span>' : '') + '</td>' +
          (vv === null ? '<td class="val err">' + T('nicht definiert', 'not defined') + '</td>' : '<td class="val">' + esc(vv) + ' ' + esc(U.unit(o.dimv)) + (alt2 ? '<span class="alt">' + esc(alt2) + '</span>' : '') + '</td>') + '</tr>';
      }).join('') + '</tbody></table>';
    } else {
      const B = S.res.B;
      h += '<div class="scroll-x"><table class="t rlist cmp"><thead><tr><th>' + T('Größe', 'Quantity') + '</th><th>A</th><th>B</th><th>B / A</th></tr></thead><tbody>' + outs.map((o) => {
        const ra = A.out[o.key], rb = B.out[o.key];
        const d = Math.min(digitsFor(o, 'A').d, 5);
        const va = fmtR(ra, d), vb = fmtR(rb, d);
        const q = ratio(ra, rb);
        const u = U.unit(o.dimv);
        return '<tr><td class="k">' + U.tex(o.tex) + (o.primary ? ' <span class="faint">★</span>' : '') + '</td>' +
          '<td class="val">' + (va === null ? '<span style="color:var(--red)">' + T('undef.', 'undef.') + '</span>' : esc(va)) + '</td>' +
          '<td class="val">' + (vb === null ? '<span style="color:var(--red)">' + T('undef.', 'undef.') + '</span>' : esc(vb)) + '</td>' +
          '<td class="ratio">' + esc(q.t) + '<br><span class="faint">' + esc(q.p) + '</span></td></tr>' +
          (u ? '' : '');
      }).join('') + '</tbody></table></div>';
      const diffs = form().c.vars.filter((v) => S.vals.A[v.key] !== S.vals.B[v.key]);
      h += '<div class="meta faint" style="font-size:12px;margin-top:8px">' + T('Einheiten wie in der Einzelansicht. ', 'Units as in the single view. ') +
        (diffs.length ? T('Unterschiede: ', 'Differences: ') + diffs.map((v) => esc(v.label) + ' ' + esc(ratio({ ok: true, ...E.mk(S.vals.A[v.key]) }, { ok: true, ...E.mk(S.vals.B[v.key]) }).t)).join(', ') : T('A und B sind noch identisch – wähle „Satz B“ und verändere einen Wert.', 'A and B are still identical – choose “Set B” and change a value.')) + '</div>';
    }
    box.innerHTML = h;
  }

  function collectIssues() {
    const list = [];
    const seen = new Set();
    const add = (i, pre) => {
      const key = i.cat + i.msg;
      if (seen.has(key)) return;
      seen.add(key);
      list.push(Object.assign({}, i, { msg: (pre || '') + i.msg }));
    };
    S.res.A.issues.forEach((i) => add(i, S.cmp ? 'A: ' : ''));
    if (S.cmp) S.res.B.issues.forEach((i) => { if (!S.res.A.issues.some((j) => j.msg === i.msg)) add(i, 'B: '); });
    list.sort((a, b) => CAT_ORDER.indexOf(a.cat) - CAT_ORDER.indexOf(b.cat));
    return list;
  }
  function renderStatus() {
    const box = $('#stat');
    if (!box) return;
    const list = collectIssues();
    const has = (c) => list.some((i) => i.cat === c);
    const chips = [
      ['math', T('Mathematisch definiert', 'Mathematically defined'), T('Mathematisch undefiniert', 'Mathematically undefined'), ''],
      ['numeric', T('Numerisch unauffällig', 'Numerically sound'), T('Numerik abgefangen', 'Numerics handled'), 'soft'],
      ['unreal', T('Physikalisch realistisch', 'Physically realistic'), T('Physikalisch unrealistisch', 'Physically unrealistic'), ''],
      ['model', T('Im Gültigkeitsbereich', 'Within the model’s range'), T('Außerhalb des Modells', 'Outside the model'), ''],
    ];
    let h = '<div class="stat">' + chips.map(([c, ok, bad, cls]) => '<div class="st ' + (has(c) ? 'warn ' + cls : '') + '">' + (has(c) ? bad : ok) + '</div>').join('') + '</div>';
    h += '<ul class="issues">' + list.map((i) => '<li class="' + i.cat + '"><b>' + CAT[i.cat] + '</b>' + esc(i.msg) + '</li>').join('') + '</ul>';
    box.innerHTML = h;
  }

  /* ---------- visualization ---------- */
  function sizeCanvas(c) {
    const dpr = globalThis.devicePixelRatio || 1;
    const W = c.clientWidth || 640, H = c.clientHeight || 330;
    if (c.width !== Math.round(W * dpr) || c.height !== Math.round(H * dpr)) { c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); }
    const ctx = c.getContext && c.getContext('2d');
    if (ctx) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { ctx, W, H };
  }
  function drawViz() {
    const c = $('#vizc');
    if (!c || !S.res.A) return;
    const { ctx, W, H } = sizeCanvas(c);
    if (!ctx) return;
    ctx.clearRect(0, 0, W, H);
    const fn = PP.viz[S.exp.viz];
    if (!fn) return;
    const res = S.res[S.edit] || S.res.A;
    // Values beyond the double range are clamped for drawing only: they are defined, just huge/tiny
    const o = (k) => {
      const r = res.out[k];
      if (!r || !r.ok) return NaN;
      if (r.s === 0) return 0;
      if (r.l > 308) return r.s * 1.7e308;

      (gone ? gone + (gone === 1 ? T(' davon kürzt sich vollständig heraus', ' of them cancels out completely') : T(' davon kürzen sich vollständig heraus', ' of them cancel out completely')) : T('nichts kürzt sich vollständig', 'nothing cancels out completely')) + '</div>';
    const di = E.dimInfo(term.dim);

    return h;
  }

  /* ---------- equation card ---------- */
  function sideBlock(side, label, cx) {
    let h = '';
    const multi = side.terms.length > 1;
    side.terms.forEach((t, k) => {
      const lbl = multi ? label + ' · ' + T('Term ', 'term ') + (k + 1) + ': ' : label + ': ';
      h += '<div class="term">';
      h += '<div class="side-lbl">' + esc(lbl) + '</div>' + U.tex((t.sign < 0 ? '-' : '') + E.toTex(t.node, cx.texMap));
      if (S.nightmare) h += nightmare(t);
      else {
        h += '<div class="facs" style="margin-top:8px">' + t.facs.map(facCard).join('') + numCard(t, cx) + '</div>';
        if (t.facs.length > 1 || t.facs.some((f) => E.rStr(f.pow) !== '1')) h += '<div class="combine">' + U.tex('\\left[\\,\\cdot\\,\\right] = ' + combineTex(t)) + '</div>';
      }
      h += '</div>';
    });
    if (multi) {
      h += '<div class="' + (side.consistentTerms ? 'faint' : 'mism') + '" style="font-size:13px">' +
        (side.consistentTerms ? T('Alle Terme haben dieselbe Dimension ', 'All terms have the same dimension ') + U.tex(dimT(side.terms[0].dim)) + T(' – nur deshalb dürfen sie addiert werden.', ' – that is the only reason they may be added.')
          : T('Die Terme haben unterschiedliche Dimensionen: ', 'The terms have different dimensions: ') + side.terms.map((t) => U.tex(dimT(t.dim))).join(' vs. ') + T('. So eine Summe ist physikalisch sinnlos.', '. Such a sum is physically meaningless.')) + '</div>';
    }
    return h;
  }
  function eqCard(q, cx, opts = {}) {
    const chk = E.checkEquation(q, cx.symDims);
    const rhs = analyzeSide(q.rhs, cx);
    const lhs = q.lhs ? analyzeSide(q.lhs, cx) : null;
    const errors = [].concat(rhs.errors, lhs ? lhs.errors : []);
    const ok = chk.consistent && errors.length === 0;
    const eqTex = (q.lhs ? E.toTex(q.lhs, cx.texMap) + ' = ' : '') + E.toTex(q.rhs, cx.texMap);
    let h = '<article class="deq"><header><h4>' + esc(q.label || T('Gleichung', 'Equation')) + '</h4><span class="verdict ' + (ok ? 'ok' : 'bad') + '">' + (ok ? T('✓ dimensionskonsistent', '✓ dimensionally consistent') : T('✗ dimensional inkonsistent', '✗ dimensionally inconsistent')) + '</span></header>';
    h += '<div class="eqrow">' + U.tex(eqTex) + '</div><div class="body">';
    if (lhs && !(opts.skipTrivialLhs && lhs.terms.length === 1 && lhs.terms[0].facs.length === 1 && lhs.terms[0].facs[0].node.type === 'var')) h += sideBlock(lhs, T('Linke Seite', 'Left-hand side'), cx);
    h += sideBlock(rhs, T('Rechte Seite', 'Right-hand side'), cx);
    if (errors.length) h += '<ul class="issues">' + errors.map((e) => '<li class="math"><b>' + T('Fehler in der Dimensionsanalyse', 'Error in the dimensional analysis') + '</b>' + esc(e.msg) + '</li>').join('') + '</ul>';
    if (lhs) {
      const same = E.dimEq(lhs.dim, rhs.dim);
      const li = E.dimInfo(lhs.dim), ri = E.dimInfo(rhs.dim);
      h += '<div class="balance' + (same ? '' : ' bad') + '"><div class="pan">' + U.tex(dimT(lhs.dim)) + '<small>' + T('links · ', 'left · ') + esc(li.name || li.unit) + '</small></div><div class="eqs">' + (same ? '=' : '≠') + '</div><div class="pan">' + U.tex(dimT(rhs.dim)) + '<small>' + T('rechts · ', 'right · ') + esc(ri.name || ri.unit) + '</small></div></div>';
      if (!same) {
        const extra = chk.mismatch.ratio;
        h += '<div class="mism">' + T('Die rechte Seite hat gegenüber der linken den Überschuss ', 'Compared with the left-hand side, the right-hand side has the surplus ') + U.tex(dimT(extra)) + (E.dimInfo(extra).name ? ' (' + esc(E.dimInfo(extra).name) + ')' : '') + T('. Genau an dieser Stelle bricht die Gleichung.', '. This is exactly where the equation breaks.') + '</div>';
      }
    }
    h += '</div></article>';
    return { html: h, ok, chk, lhs, rhs, errors };
  }

  /* ---------- page (tab) ---------- */
  function notesHTML(exp) {

    }

  }

  function customCtx(syms) {
    const symDims = Object.create(null), texMap = Object.create(null), names = Object.create(null), rows = [];
    for (const k in E.NUMERIC_SYMBOLS) symDims[k] = E.dimless();
    for (const s of syms) {
      const over = has(S.custom.dims, s) ? S.custom.dims[s] : undefined;
      let src, str, err = null;
      if (over !== undefined) { src = 'own'; str = String(over); }
      else if (has(M.C, s)) { src = 'const'; str = M.C[s].dim; }
      else if (has(USER_SYMS, s) && USER_SYMS[s][0] !== null) { src = 'std'; str = USER_SYMS[s][0]; }
      else { src = 'unknown'; str = null; }
      if (str !== null) {
        try { symDims[s] = E.dimParse(str.replace(/Θ/g, 'Θ')); } catch (e) { err = e.message; }
      }
      if (has(M.C, s)) { texMap[s] = M.C[s].tex; names[s] = M.C[s].name; }
      else if (has(USER_SYMS, s)) names[s] = USER_SYMS[s][1];
      if (isAlt(s)) names[s] = AMBIG[s].altName;
      rows.push({ s, src, str, err, ambig: has(AMBIG, s) });
    }
    return { symDims, texMap, names, rows };
  }

  function suggestFix(ratio) {
    // find c^a G^b ħ^d k_B^e (small exponents) with the dimension of the surplus
    const keys = ['c', 'G', 'hbar', 'k_B'];
    const dims = keys.map((k) => M.C[k].dimv);
    let best = null;
    for (let a = -4; a <= 4; a++) for (let b = -2; b <= 2; b++) for (let d = -2; d <= 2; d++) for (let e = -2; e <= 2; e++) {
      const cost = Math.abs(a) + Math.abs(b) + Math.abs(d) + Math.abs(e);
      if (!cost || (best && cost >= best.cost)) continue;
      let dm = E.dimless();
      [a, b, d, e].forEach((p, i) => { if (p) dm = E.dimMul(dm, E.dimPow(dims[i], E.R(p))); });
      if (E.dimEq(dm, ratio)) best = { cost, exps: [a, b, d, e] };
    }
    if (!best) return null;
    // the RHS must be DIVIDED by the surplus
    const parts = best.exps.map((p, i) => (p ? powTex(M.C[keys[i]].tex, E.R(-p)) : '')).filter(Boolean);
    return parts.join('\\,');
  }

  function markSrc(src, ranges) {
    const rs = ranges.filter((r) => r && r[1] > r[0]).sort((a, b) => a[0] - b[0]);
    const merged = [];
    rs.forEach((r) => { const l = merged[merged.length - 1]; if (l && r[0] <= l[1]) l[1] = Math.max(l[1], r[1]); else merged.push(r.slice()); });
    let out = '', p = 0;
    merged.forEach(([a, b]) => { out += esc(src.slice(p, a)) + '<mark>' + esc(src.slice(a, b)) + '</mark>'; p = b; });
    return out + esc(src.slice(p));
  }

        '<p class="faint" style="font-size:13px">' + T('Syntax: <span class="kbd">*</span> oder Leerzeichen für Mal, <span class="kbd">/</span>, <span class="kbd">^</span>, <span class="kbd">sqrt( )</span>, Unicode wie ħ, π, ² ist erlaubt.', 'Syntax: <span class="kbd">*</span> or a space for multiplication, <span class="kbd">/</span>, <span class="kbd">^</span>, <span class="kbd">sqrt( )</span>; Unicode such as ħ, π, ² is allowed.') + '</p>';

    const syms = new Set();

    const cx = customCtx(list);
    // unknown single-symbol LHS → infer its dimension instead of failing

    if (parsed.lhs && parsed.lhs.type === 'var' && !cx.symDims[parsed.lhs.name]) {
      const an = E.dimAnalyze(parsed.rhs, cx.symDims);

    }

        return '<div class="callout">' + T('<b>Schreibweise prüfen:</b> Mal und Geteilt werden von links nach rechts gelesen, deshalb steht hier ', '<b>Check the notation:</b> multiplication and division are read from left to right, so this says ') + U.tex(E.toTex(a.node, cx.texMap)) +
          T('. Falls ', '. If you meant ') + U.tex(E.toTex(a.alt, cx.texMap)) + T(' gemeint ist, fehlen Klammern.', ', brackets are missing.') + ' <button class="btn sm" data-fixsrc="' + esc(fixed) + '">' + T('Klammern setzen', 'Add brackets') + '</button></div>';
      }).join('');
    }
    // symbol table
    h += '<h2 class="sec" style="margin-top:20px">' + T('Symbole und angenommene Dimensionen', 'Symbols and assumed dimensions') + '</h2>';
    h += '<div class="scroll-x"><table class="t symtab"><thead><tr><th>Symbol</th><th>' + T('Herkunft', 'Source') + '</th><th>Dimension</th><th></th><th>' + T('Bedeutung', 'Meaning') + '</th></tr></thead><tbody>' +
      cx.rows.map((r) => {
        const isInf = inferred && inferred.name === r.s;

   ===================================================================== */
(function (PP) {

  const U = PP.ui, I = PP.i18n, T = I.T;
